<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机数之王4 · 王国争霸</title>
<style>
:root{
  --bg:#0f0d15;
  --bg2:#151220;
  --panel:#1b1726;
  --panel2:#221d30;
  --line:#332b45;
  --ink:#ece6da;
  --dim:#8d849b;
  --gold:#e8c46a;
  --gold-dim:#8f7a45;
  --blood:#e05a4f;
  --jade:#57c99b;
  --violet:#9b7ede;
  --lcd:#9ff5c8;
  --g0:#9aa0a6;
  --g1:#5ba9e8;
  --g2:#a06ee8;
  --g3:#e8973a;
  --g4:#e8524b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 700px at 50% -10%, #241d38 0%, transparent 60%),
    radial-gradient(900px 600px at 10% 110%, #1a2030 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  -webkit-user-select:none; -moz-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;      /* 禁掉手机端双击放大 */
}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-select:none}
.num{font-family:"Consolas","Courier New",monospace;font-variant-numeric:tabular-nums}
#app{max-width:1180px;margin:0 auto;padding:14px 16px 40px;position:relative}

/* ============ HUD ============ */
#hud{
  display:none;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
  align-items:stretch;
}
#hud.on{display:flex}
.hud-card{
  background:linear-gradient(180deg,#221d30,#1a1626);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 12px;
  box-shadow:0 2px 0 #0b0912, inset 0 1px 0 #3a3250;
  display:flex;flex-direction:column;justify-content:center;
}
.hud-card .k{font-size:11px;color:var(--dim);letter-spacing:.14em;margin-bottom:2px}
.hud-card .v{font-size:17px;font-weight:700;line-height:1.15}
.hud-hp{flex:1 1 260px;min-width:230px}
.hpbar{
  height:16px;border-radius:4px;background:#0c0a12;
  border:1px solid #3a3150;overflow:hidden;margin-top:3px;position:relative;
}
.hpbar>i{
  display:block;height:100%;width:100%;
  background:linear-gradient(180deg,#f07a6c,#b8322a);
  transition:width .35s cubic-bezier(.2,.8,.2,1);
}
.hpbar>span{
  position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px;
  font-weight:700;text-shadow:0 1px 2px #000;letter-spacing:.04em;
}
.hud-gold .v{color:var(--gold)}
.hud-luck .v{color:var(--violet)}
.draw-tools{display:flex;gap:10px;justify-content:center;margin-top:12px}
.draw-btn{width:42px;height:42px;border-radius:50%;border:1px solid #3a3150;
  background:linear-gradient(180deg,#221c33,#171223);color:#e8c46a;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.draw-btn.on{border-color:var(--gold);box-shadow:0 0 10px rgba(232,196,106,.45);
  background:linear-gradient(180deg,#2f2748,#221c33)}
#map-draw{position:absolute;left:0;top:0;z-index:4;pointer-events:none;touch-action:none}
.itm .numtag{position:absolute;left:-2px;top:-2px;background:#2a2342;border:1px solid #4a3f63;
  color:#b9b0c8;font-size:8px;line-height:1;padding:1px 3px;border-radius:6px;pointer-events:none}
#title-menu-btn{position:fixed;top:14px;right:14px;z-index:40;width:42px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold);cursor:pointer;
  background:linear-gradient(180deg,#221c33,#171223);border:1px solid #3a3150;user-select:none}
#title-menu-btn:hover{border-color:var(--gold)}
.node.done{opacity:.35;filter:grayscale(.7)}
.node.dead{opacity:.3;filter:grayscale(1)}
.node .nx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#e8524b;font-size:22px;font-weight:900;text-shadow:0 0 6px rgba(0,0,0,.8);pointer-events:none}
.node{position:relative}
.node .fire{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:14px;
  filter:drop-shadow(0 0 6px #ff8a3d);animation:fireFlick .9s infinite alternate}
@keyframes fireFlick{from{transform:translateX(-50%) scale(.85);opacity:.75}to{transform:translateX(-50%) scale(1.1);opacity:1}}
.node.elite{border-color:#ff8a3d !important;box-shadow:0 0 12px rgba(255,120,40,.45)}

/* ============ 场景 ============ */
#stage{position:relative;min-height:520px}
.screen{display:none;animation:fade .3s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.panel{
  background:linear-gradient(180deg,#1d1828,#171320);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 8px 24px -12px #000, inset 0 1px 0 #3c3354;
}

/* ============ 标题页 ============ */
#screen-title{padding:26px 4px}
.title-wrap{text-align:center;margin-bottom:26px}
.title-main{
  font-size:clamp(32px,6vw,58px);
  font-weight:900;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff3d0,#e8c46a 45%,#a8792c);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(232,196,106,.18);
  line-height:1.1;
}
.title-sub{
  margin-top:6px;color:var(--dim);letter-spacing:.42em;font-size:13px;
}
.title-tag{
  display:inline-block;margin-top:12px;padding:2px 10px;border-radius:999px;
  border:1px solid #5c4a2a;color:#d9bd7f;font-size:11px;letter-spacing:.2em;background:#241d12;
}
.title-quote{
  max-width:660px;margin:22px auto 0;color:#a99fb8;line-height:1.9;font-size:13.5px;
  border-left:2px solid #3a3150;padding-left:14px;text-align:left;
}
.tip{color:#7b7289;font-size:12px;margin-top:18px;text-align:center;line-height:1.7}

/* ============ 难度调节 ============ */
.diff-box{
  max-width:620px;margin:18px auto 0;padding:14px 16px;
  background:linear-gradient(180deg,#1f1a2b,#171320);
  border:1px solid #332b45;border-radius:12px;
}
.diff-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.diff-head .t{font-size:11px;letter-spacing:.24em;color:var(--gold-dim)}
#diff-label{font-size:13px;font-weight:800;color:var(--gold);font-family:Consolas,monospace}
.diff-slider-row{display:flex;align-items:center;gap:10px}
.diff-slider-row .e{font-size:11px;color:#6f6786}
#diff-slider{
  -webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;outline:none;
  background:linear-gradient(90deg,#57c99b,#e8c46a 55%,#e05a4f);
}
#diff-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff3d0,#e8c46a 60%,#a8792c);
  border:1px solid #7a5c1e;box-shadow:0 2px 6px #000;cursor:pointer;
}
#diff-slider::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:#e8c46a;border:1px solid #7a5c1e;cursor:pointer;
}
.diff-presets{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.diff-presets button{
  font-family:inherit;font-size:11.5px;padding:5px 12px;border-radius:999px;cursor:pointer;
  background:#241e33;border:1px solid #4a3f63;color:#b9b0c8;
}
.diff-presets button:hover{border-color:var(--gold-dim);color:var(--gold)}
.diff-note{font-size:11px;color:#6f6786;text-align:center;margin-top:8px;line-height:1.6}

/* ============ 按钮 ============ */
.btn{
  font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.05em;
  color:#221a10;
  background:linear-gradient(180deg,#f2d98f,#d9ae55 60%,#b98d34);
  border:1px solid #7a5c1e;border-radius:9px;
  padding:11px 22px;cursor:pointer;
  box-shadow:0 3px 0 #6b4f18, 0 6px 18px -8px #000;
  transition:transform .08s, filter .15s, box-shadow .08s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6b4f18}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;transform:none}
.btn.ghost{
  background:linear-gradient(180deg,#2a2438,#201b2c);color:#d6cde6;
  border:1px solid #4a3f63;box-shadow:0 3px 0 #151020;
}
.btn.ghost:hover{filter:brightness(1.2)}
.btn.blood{
  background:linear-gradient(180deg,#f08a7c,#c2402f 60%,#9a2f22);color:#fff2ee;
  border:1px solid #6e2018;box-shadow:0 3px 0 #521710;
}
.btn.sm{padding:7px 14px;font-size:12.5px;border-radius:7px;box-shadow:0 2px 0 #6b4f18}
.btn.block{display:block;width:100%}

/* ============ 角色选择 ============ */
.sect-title{
  font-size:12px;letter-spacing:.28em;color:var(--gold-dim);
  margin:20px 0 12px;display:flex;align-items:center;gap:12px;
}
.sect-title:before,.sect-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#3a3150,transparent)}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.char-card{
  text-align:left;cursor:pointer;padding:14px;
  background:linear-gradient(180deg,#221d30,#1a1526);
  border:1px solid #3a3150;border-radius:12px;color:inherit;font-family:inherit;
  transition:.15s;position:relative;overflow:hidden;
}
.char-card:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
.char-card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim),0 8px 26px -12px #e8c46a}
.char-card .cname{font-size:16px;font-weight:800;margin-bottom:2px}
.char-card .chp{font-size:11.5px;color:var(--dim);margin-bottom:8px;letter-spacing:.06em}
.char-card .cdesc{font-size:12.5px;color:#b9b0c8;line-height:1.7;min-height:44px}
.char-card .citem{margin-top:9px;font-size:11.5px;color:#8f86a0}
.char-emoji{position:absolute;right:10px;top:8px;font-size:30px;opacity:.28}

/* ============ 地图 ============ */
.map-panel{
  max-height:420px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:16px 0 16px 0;position:relative;
  background:linear-gradient(180deg,#161221,#13101c);
  border:1px solid #2c2540;border-radius:12px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.6);
}
.map-wrap{display:flex;flex-direction:column;align-items:center;min-width:max-content;padding:0 20px;margin:0 auto;box-sizing:border-box}
.node-row{display:flex;flex-direction:column;align-items:center;position:relative}
.node{
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;font-size:17px;
  background:#1a1526;border:2px solid #3a3150;position:relative;
  transition:.2s;
}
.node.done{border-color:#4a4160;background:#141020;filter:grayscale(.7) brightness(.7)}
.node.now{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,196,106,.12),0 0 22px rgba(232,196,106,.35);transform:scale(1.06)}
.node.future{border-color:#3a3150;opacity:.55}
.node .nlabel{
  position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--dim);white-space:nowrap;letter-spacing:.06em;
}
.node.now .nlabel{color:var(--gold)}
.connector{width:2px;height:14px;background:linear-gradient(180deg,#4a4160,#2c2540);border-radius:2px}
.connector.done{background:linear-gradient(180deg,#8f7a45,#4a4160)}

/* ============ 战斗 ============ */
.battle-top{
  display:grid;grid-template-columns:1fr 190px 1fr;gap:14px;align-items:start;margin-bottom:12px;
}
@media(max-width:820px){.battle-top{grid-template-columns:1fr;}}
.combatant{padding:14px;position:relative}
.combatant .who{font-size:11px;letter-spacing:.24em;color:var(--dim);margin-bottom:4px}
.combatant .cname2{font-size:19px;font-weight:800;margin-bottom:2px}
.enemy-art{font-size:52px;line-height:1;margin:4px 0 8px;filter:drop-shadow(0 6px 14px #000)}
.bigbar{height:22px;border-radius:5px;background:#0b0912;border:1px solid #3a3150;overflow:hidden;position:relative}
.bigbar>i{display:block;height:100%;transition:width .3s}
.bigbar.enemy>i{background:linear-gradient(180deg,#e0736a,#9c2b24)}
.bigbar.player>i{background:linear-gradient(180deg,#68d8a4,#2c8f66)}
.bigbar>span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000}

/* 计算器 */
.calc{
  background:linear-gradient(180deg,#2b3340,#1d242e 70%,#161b23);
  border:1px solid #46536a;border-radius:14px;padding:12px 12px 10px;
  box-shadow:0 10px 26px -12px #000, inset 0 1px 0 #5f6d85;
}
.calc-brand{font-size:9px;letter-spacing:.3em;color:#6f7f96;margin-bottom:6px;display:flex;justify-content:space-between}
.lcd{
  background:linear-gradient(180deg,#0d1a14,#0a1410);
  border:1px solid #2c4438;border-radius:6px;
  padding:8px 10px;text-align:right;
  box-shadow:inset 0 3px 10px #000;
}
.lcd .expr{font-size:11px;color:#4e8f72;font-family:Consolas,monospace;min-height:14px;letter-spacing:.06em;text-align:left}
.lcd .out{
  font-family:Consolas,"Courier New",monospace;
  font-size:34px;font-weight:700;color:var(--lcd);
  text-shadow:0 0 14px rgba(159,245,200,.5);line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.lcd .out.flick{color:#5aa07f;text-shadow:none}
.lcd .range{font-size:10.5px;color:#4e8f72;letter-spacing:.12em;font-family:Consolas,monospace}
.lcd .formula{
  font-size:10px;color:#6fbf95;font-family:Consolas,monospace;text-align:left;
  margin-top:3px;letter-spacing:.01em;min-height:12px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lcd .buffs{
  font-size:9.5px;color:#d9b45f;font-family:Consolas,monospace;text-align:left;
  margin-top:1px;min-height:11px;line-height:1.25;white-space:nowrap;overflow:hidden;
}
.itm.usable{cursor:pointer}.itm.usable:hover{box-shadow:0 0 0 2px rgba(232,196,106,.5),0 0 16px rgba(232,196,106,.25)}
.itm .use{
  position:absolute;left:-3px;top:-4px;font-size:10px;line-height:1;
  background:#e8c46a;color:#1a1206;border-radius:50%;width:13px;height:13px;
  display:grid;place-items:center;font-weight:900;
}
.itm .startup{
  position:absolute;right:-3px;top:-5px;font-size:9px;line-height:1;
  background:#57c99b;color:#0d1a14;border-radius:50%;width:12px;height:12px;
  display:grid;place-items:center;
}
.itm.tapped{animation:tap .3s}
@keyframes tap{0%,100%{transform:none}50%{transform:scale(1.18)}}
.itm.holding{
  outline:2px solid var(--gold);
  box-shadow:0 0 14px rgba(232,196,106,.55) !important;
  animation:holdPulse .5s infinite alternate;
}
@keyframes holdPulse{from{transform:none}to{transform:scale(1.06)}}
.stat-chip{cursor:pointer;transition:.12s}
.stat-chip:hover{filter:brightness(1.25)}
.itm.spent{
  filter:grayscale(1) brightness(.55);opacity:.6;cursor:default;
  box-shadow:none !important;border-color:#3a3150 !important;
}
.itm.spent .g{background:#3a3150;color:#8d849b}
.itm.spent .use,.itm.spent .startup{display:none}
.itm.s-1{border-color:#8a6fd0;box-shadow:inset 0 0 14px rgba(155,126,222,.3),0 0 10px rgba(155,126,222,.15)}

/* 攻击按钮区 */
.startup-bar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:6px 10px;margin-bottom:8px;
  background:linear-gradient(180deg,#1d2a24,#17211c);
  border:1px solid #2f5c47;border-radius:9px;
}
.startup-bar .startup-k{
  font-size:10px;letter-spacing:.22em;color:#7fdcaa;flex:none;
}
.action-zone{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:16px 0 10px}
.attack-counter{font-size:12px;color:var(--dim);letter-spacing:.1em}
.attack-counter b{color:var(--ink);font-size:15px}

/* 战斗日志 */
.logbox{
  margin-top:14px;height:150px;overflow-y:auto;padding:10px 12px;
  background:#100d18;border:1px solid #2c2540;border-radius:10px;
  font-size:12.5px;line-height:1.85;
}
.logbox .l{display:flex;gap:8px}
.logbox .l .t{color:#4a4160;font-family:Consolas,monospace;font-size:11px;flex:none;padding-top:2px}
.logbox .l.hit .m{color:#f0a09a}
.logbox .l.hurt .m{color:#e07a7a}
.logbox .l.good .m{color:#7fdcaa}
.logbox .l.gold .m{color:var(--gold)}
.logbox .l.sys .m{color:#a99fb8}
.logbox .l.item .m{color:#c9aef0}

/* ============ 道具栏 ============ */
.inv-wrap{margin-top:6px}
.inv-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:5px}
.inv-row-name{
  flex:0 0 34px;text-align:right;font-size:10px;color:#6f6786;
  letter-spacing:.08em;padding-top:14px;white-space:nowrap;
}
.inv-row .inv{flex:1 1 auto;min-width:0}
.inv-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.22em;color:var(--gold-dim);margin-bottom:8px}
.inv{display:flex;gap:7px;flex-wrap:wrap}
.itm{
  width:44px;height:44px;border-radius:9px;display:grid;place-items:center;
  font-size:21px;cursor:help;position:relative;
  background:linear-gradient(180deg,#2f2740,#221c31);
  border:1px solid #4a3f63;transition:.14s;
  filter:saturate(1.1) brightness(1.08);
}
.itm:hover{transform:translateY(-2px)}
.itm .g{position:absolute;right:-1px;bottom:-2px;font-size:9px;font-weight:800;color:#0d0a14;background:var(--g0);border-radius:4px;padding:0 3px;line-height:12px}
.itm.one-shot:after{content:"¹";position:absolute;left:2px;top:0;font-size:10px;color:#8d849b}
.itm.new{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.itm.s0{border-color:#6c7178;box-shadow:inset 0 0 12px rgba(154,160,166,.14)}
.itm.s1{border-color:var(--g1);box-shadow:inset 0 0 12px rgba(91,169,232,.18)}
.itm.s2{border-color:var(--g2);box-shadow:inset 0 0 14px rgba(160,110,232,.24)}
.itm.s3{border-color:var(--g3);box-shadow:inset 0 0 16px rgba(232,151,58,.28)}
.itm.s4{border-color:var(--g4);box-shadow:inset 0 0 18px rgba(232,82,75,.34),0 0 14px rgba(232,82,75,.2)}
.itm.s1 .g{background:var(--g1)}.itm.s2 .g{background:var(--g2)}
.itm.s3 .g{background:var(--g3);color:#1a1206}.itm.s4 .g{background:var(--g4);color:#2a0606}
.itm.s0 .g{background:var(--g0)}
.empty-note{font-size:11.5px;color:#5c5470;padding:12px 0}

/* 提示框 */
#tip{
  position:fixed;z-index:99;max-width:300px;pointer-events:none;
  background:#0d0b14;border:1px solid #4a3f63;border-radius:9px;
  padding:10px 12px;font-size:12.5px;line-height:1.7;color:#d8d0e4;
  box-shadow:0 14px 40px -10px #000;opacity:0;transition:opacity .12s;
}
#tip.on{opacity:1}
#tip .tn{font-weight:800;font-size:13.5px;margin-bottom:3px}
#tip .tm{font-size:10.5px;color:var(--dim);letter-spacing:.12em;margin-bottom:6px}
#tip .td b{color:var(--gold)}

/* ============ 宝箱 / 商店 ============ */
.center-col{max-width:780px;margin:0 auto;text-align:center}
.card-stage{padding:26px 18px;margin-top:6px;position:relative}
.loot-card{
  max-width:400px;margin:16px auto;padding:18px;text-align:left;
  background:linear-gradient(180deg,#241e33,#1a1526);
  border:1px solid var(--line);border-radius:14px;position:relative;
}
.loot-card .lc-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}

<body>
<div id="app">
  <div id="hud"></div>
  <div id="stage">
    <section id="screen-title" class="screen"></section>
    <section id="screen-map" class="screen"></section>
    <section id="screen-battle" class="screen"></section>
    <section id="screen-loot" class="screen"></section>
    <section id="screen-shop" class="screen"></section>
    <section id="screen-result" class="screen"></section>
  </div>
</div>
<div id="tip"></div>
<script>
"use strict";
/* ============================================================
   随机数之王4 · 王国争霸
   ============================================================ */
/* ---------------- 工具 ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- 种子与随机数 ----------------
   每一局有一个短种子，局内所有随机数都由它决定：
   同一个种子 + 同一个角色 = 完全相同的一局，可以分享给别人。 */
const SEED_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // 去掉了 I O 0 1，方便口述
const SEED_LEN = 6;

function genSeed(){
  let s = "";
  for (let i = 0; i < SEED_LEN; i++) s += SEED_CHARS[Math.floor(Math.random() * SEED_CHARS.length)];
  return s;
}

function hashSeed(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/* mulberry32 */
function makeRng(seedStr){
  let a = hashSeed(seedStr) || 1;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 局内取随机数：有种子走种子，没种子（标题界面）走真随机 */
function rnd(){ return S.rng ? S.rng() : Math.random(); }
const ri = (a,b) => Math.floor(rnd()*(b-a+1))+a;

/* ---------------- 全局状态 ---------------- */
const S = {
  screen: "title",
  char: null,
  hp: 0, maxHp: 0,
  gold: 0,
  items: [],
  uidSeq: 1,
  depth: 0,            // 已完成的敌人节点数
  map: [],
  nodeIdx: 0,
  battle: null,
  totalKills: 0,
  totalGold: 0,
  log: [],
  shopState: null,
  loot: null,
  perm: {},
  diff: 0.80,
  autoNext: false,
  seed: "",
  rng: null,
  oneshotClick: "double",
  repeatPrompt: false,
  floors: 12,
  busy: false,
};

/* 幸运：每 +1 幸运 = 所有正面概率 +5% */
function chance(p){
  const st = stats();
  let q = p;
  // 大大大顺：不大于 50% 的概率翻倍
  if (q <= 0.5 && S.items.some(i => i.def.id === 392 && !i.spent)) q *= 2;
  return rnd() < Math.min(0.95, clamp(q + st.luck*0.05, 0, 1));
}

/* 信封：把奖励寄存到下一局（存 localStorage） */
function queueNextRunItem(n){
  try {
    const cur = parseInt(localStorage.getItem("rk4_envelope") || "0", 10) || 0;
    localStorage.setItem("rk4_envelope", String(cur + (n || 1)));
  } catch(e){}
}
function takeQueuedItems(){
  try {
    const n = parseInt(localStorage.getItem("rk4_envelope") || "0", 10) || 0;
    if (n > 0) localStorage.removeItem("rk4_envelope");
    return n;
  } catch(e){ return 0; }
}

/* 难度（游戏内可调） */
const DIFF_MIN = 0.40, DIFF_MAX = 1.40;

function diffText(v){
  const n = Math.round(v * 100);
  let tag = "普通";
  if (v < 0.60) tag = "简单";
  else if (v >= 0.60 && v < 0.86) tag = "普通";
  else if (v >= 0.86 && v < 1.06) tag = "困难";
  else tag = "地狱";
  return `×${(v).toFixed(2)} ${tag}`;
}

function loadDiff(){
  try {
    const v = parseFloat(localStorage.getItem("rk4_diff"));
    if (v >= DIFF_MIN && v <= DIFF_MAX) return v;
  } catch(e){}
  return 0.80;
}
function saveDiff(){
  try { localStorage.setItem("rk4_diff", String(S.diff)); } catch(e){}
}
function onDiffInput(v){
  S.diff = clamp(+v / 100, DIFF_MIN, DIFF_MAX);
  const lab = $("#diff-label");
  if (lab) lab.textContent = diffText(S.diff);
  saveDiff();
}
function setDiffPreset(v){
  S.diff = clamp(v, DIFF_MIN, DIFF_MAX);
  const sl = $("#diff-slider");
  if (sl) sl.value = Math.round(S.diff * 100);
  const lab = $("#diff-label");
  if (lab) lab.textContent = diffText(S.diff);
  saveDiff();
}

/* ---------------- 全局平衡系数（调难度用） ---------------- */
const BALANCE = {
  enemyHp: 0.80,   // 敌人血量倍率（第 1 关保持手稿固定的 25），开局按难度覆盖
  heal: 20,        // 每关基础回血
  demand: 1.00,    // 敌人伤害倍率（预留）
};

/* ---------------- 属性合成 ---------------- */
const BASE_STATS = {
  minDmg:1, maxDmg:10, addDmg:0, reduceDmg:0, boostDmg:0,
  luck:0, heal:20, attackCount:1, rolls:0, goldBonus:0, shopDisc:0, shopSlots:3,
  hpMax:40, mult:1, immunity:0, noHeal:false, cannotAttack:false, noShop:false,
  goldDouble:false, itemDouble:false, rollPrice:1, healMult:1, enemyDmg:0, enemyMult:1, noGoldGain:false,
  refreshPrice:2, priceMult:1, oneShotBonus:0, healOvercap:false, goldCap:100,
};

function stats(){
  const st = Object.assign({}, BASE_STATS);
  st.heal = BALANCE.heal;
  st.hpMax = S.char ? (S.char.hpRolled ?? S.char.hp) : 40;

  const apply = (m) => {
    if (!m) return;
    for (const k in m){
      if (k === "itemDouble" || k === "goldDouble" || k === "noHeal" ||
          k === "cannotAttack" || k === "noShop" || k === "enemyFirst" || k === "noGoldGain"){
        st[k] = m[k] || st[k];
      } else if (k === "mult" || k === "enemyMult" || k === "healMult"){
        st[k] = (st[k] ?? 1) * m[k];
      } else {
        st[k] = (st[k] ?? 0) + m[k];
      }
    }
  };
  apply(S.perm);
  for (const it of S.items){ if (it.spent) continue; apply(it.mods || it.def.mods); if (it.dyn) it.dyn(st); }
  if (S.goldenChild > 0) st.addDmg += 8;        // 金嗓子：之后两关伤害 +8
  if (S.battle && !S.battle.over){ apply(S.battle.temp); apply(S.battle.roundTemp); }
  // 结算类 dyn（犹大、塔盾的加伤/减伤互转）放在最后，才能算上战斗内加成
  for (const it of S.items) if (it.def.dyn && !it.spent) it.def.dyn(st);
  st.minDmg = Math.max(0, Math.round(st.minDmg));
  st.maxDmg = Math.max(st.minDmg, Math.round(st.maxDmg));
  st.attackCount = Math.max(1, Math.round(st.attackCount));
  st.rolls = Math.max(0, Math.round(st.rolls));
  st.luck = Math.round(st.luck);
  st.hpMax = Math.max(1, Math.round(st.hpMax));
  st.immunity = clamp(st.immunity, 0, 100);
  st.mult = Math.max(0, st.mult);
  st.shopSlots = clamp(Math.round(st.shopSlots), 1, 6);
  st.heal = Math.round(st.heal);
  st.addDmg = Math.round(st.addDmg);           // 加伤可以为负：负数会减少自身伤害
  st.reduceDmg = Math.round(st.reduceDmg);
  // 减伤最多 9，多出来的自动转成加伤
  if (st.reduceDmg > 9){
    const over = st.reduceDmg - 9;
    st.reduceDmg = 9;
    st.addDmg += over;
  }
  st.goldCap = Math.max(0, Math.round(st.goldCap));
  return st;
}

const maxHp = () => stats().hpMax;
const goldCap = () => stats().goldCap;

/* 是否持有某个角色能力道具（-1 级） */
function hasAbility(id){
  return S.items.some(i => i.def.id === id && !i.spent);
}

/* ---------------- 道具库 ---------------- */
const TYPE_ICON = {"攻击类":"⚔️","防御类":"🛡️","经济类":"💰","功能类":"✨"};
const D = (id,name,grade,type,desc,x) => Object.assign({id,name,grade,type,desc,icon:TYPE_ICON[type]}, x||{});

/* 舅产的道具池（按手稿编号，未实装的自动跳过） */
const JIUCHAN_POOL = [29,100,109,129,170,184,187,200,227,229,259,263,269,279,293,297,300,329,400,410,429];

const ITEMS = [
/* ================= 0 级 ================= */
D(45,"水珠",0,"防御类","血量回复 +3。",{icon:"💧",mods:{heal:3}}),
D(62,"巫师帽",0,"功能类","攻击次数 +1。攻击有 50% 概率失败。",{icon:"🎩",mods:{attackCount:1},
  hooks:{onAttackWindup:(c)=>{ if(!chance(0.5)) c.canceled=true; }}}),

const ITEM_BY_ID = new Map();
const poolByGrade = {};

function buildIndex(){
  ITEM_BY_ID.clear();
  for (const d of ITEMS) ITEM_BY_ID.set(d.id, d);
  for (const k in poolByGrade) delete poolByGrade[k];
  for (const d of ITEMS){
    if (d.id <= 0 || d.draw === false || d.shopOnly) continue;   // 只在商店出现的道具不进抽取池
    (poolByGrade[d.grade] = poolByGrade[d.grade] || []).push(d.id);
  }
}
const drawableIds = () => ITEMS.filter(d => d.id > 0 && d.draw !== false && !d.shopOnly).map(d => d.id);

/* ---------------- 合成宝袋 ---------------- */
function bagDigits(){
  if (!Array.isArray(S.bag)) S.bag = [];
  return S.bag;
}
/* 得到道具时，把编号拆成 3 位数字存进袋子（如 1 -> 0,0,1） */
function bagStoreItem(id){
  if (!S.items.some(i => i.def.id === -31 && !i.spent)) return false;
  const n = Math.abs(Math.trunc(Number(id) || 0));
  const str = String(n).padStart(3, "0").slice(-3);
  const bag = bagDigits();
  for (const ch of str) bag.push(Number(ch));
  // 袋子最多存 30 个数字，防止无限堆积
  while (bag.length > 30) bag.shift();
  return true;
}


/* 情报里该隐模式：宝袋界面直接列出当前数字能合成的全部道具 */
function cainIntel(){ try { return localStorage.getItem("rk4_cain_intel") === "1"; } catch(e){ return false; } }
function toggleCainIntel(){
  const on = cainIntel();
  try { localStorage.setItem("rk4_cain_intel", on ? "0" : "1"); } catch(e){}
  closeModal();
  openMenu();
}

/* 用袋子里的数字能拼出哪些道具（顺序有意义，按三位数算） */
function bagCraftables(){
  const bag = bagDigits().slice();
  const out = [];
  const seen = {};
  for (let a = 0; a < bag.length; a++)
    for (let b = 0; b < bag.length; b++){
      if (b === a) continue;
      for (let c = 0; c < bag.length; c++){
        if (c === a || c === b) continue;
        const num = bag[a]*100 + bag[b]*10 + bag[c];
        if (seen[num]) continue;
        const def = shownDef(num);
        if (!def || (def.grade || 0) < 0) continue;
        seen[num] = 1;
        out.push({ num, def });
        if (out.length >= 40) return out;
      }
    }
  return out;
}

function openCraftBag(){
  const bag = bagDigits();
  if (!bag.length){
    modalShell(`<h3>🧰 合成宝袋</h3>
      <div class="msub">袋子还是空的。每得到一件道具，它的编号会被拆成 3 个数字存进来。</div>
      <div class="modal-close"><button class="btn" onclick="closeModal()">关 闭</button></div>`);
    return;
  }
  let picked = [];   // 选中的数字「值」列表，最多 3 个

  const render = () => {
    // 统计剩余可用数量（扣掉已选中的）
    const used = {};
    picked.forEach(v => { used[v] = (used[v] || 0) + 1; });
    const groups = {};
    bag.forEach(v => { groups[v] = (groups[v] || 0) + 1; });
    const chips = Object.keys(groups).map(Number).sort((a,b)=>a-b).map(v => {
      const left = groups[v] - (used[v] || 0);
      if (left <= 0) return "";
      return `<button class="btn sm" data-v="${v}" style="position:relative;min-width:46px;margin:5px">
        ${v}${left > 1 ? `<span style="position:absolute;right:-4px;bottom:-4px;background:#e8c46a;color:#1a1206;
          border-radius:999px;font-size:9px;padding:0 4px;font-weight:800">${left}</span>` : ""}</button>`;
    }).join("");
    const code = picked.length ? String(Number(picked.join(""))).padStart(3,"0") : "";
    const div = modalShell(`<h3>🧰 合成宝袋</h3>
      <div class="msub">点数字放到上面，凑满 3 位即可合成编号为 <b style="color:var(--gold)">${code || "—"}</b> 的道具。</div>
      <div id="bag-picked" style="font-size:26px;letter-spacing:10px;color:var(--gold);text-align:center;margin:10px 0 6px;min-height:34px">
        ${picked.length ? picked.map((v,i)=>`<span data-p="${i}" style="cursor:pointer">${v}</span>`).join(" ") : "— — —"}
      </div>
      <div style="font-size:10.5px;color:var(--dim);text-align:center;margin:-4px 0 8px">左键添加 · 右键收回</div>
      <div style="display:flex;flex-wrap:wrap;justify-content:center;max-height:190px;overflow:auto">${chips}</div>
      ${cainIntel() ? (() => {
        const list = bagCraftables();
        if (!list.length) return `<div class="seed-hint" style="margin-top:6px">当前数字还拼不出任何道具</div>`;
        return `<div class="seed-label" style="margin-top:10px">情报里该隐 · 当前可合成</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;margin-top:4px">
            ${list.map(o => `<button class="btn ghost sm" data-craft="${o.num}">${esc(o.def.icon)} #${o.num} ${esc(o.def.name)}</button>`).join("")}
          </div>`;
      })() : ""}
      <div class="modal-close" style="display:flex;gap:8px;justify-content:center;margin-top:10px">
        <button class="btn" id="bag-make" ${picked.length === 3 ? "" : "disabled"}>合 成</button>
        <button class="btn ghost" id="bag-clear">重 选</button>
        <button class="btn ghost" id="bag-close">关 闭</button>
      </div>`);
    div.querySelectorAll("[data-v]").forEach(btn => {
      const v = Number(btn.dataset.v);
      // 左键：放一个进来
      btn.onclick = () => {
        if (picked.length >= 3) return;
        picked.push(v);
        render();
      };
      // 右键：收回一个（放回袋子里）
      btn.oncontextmenu = (e) => {
        e.preventDefault();
        const i = picked.indexOf(v);
        if (i >= 0){ picked.splice(i, 1); render(); }
      };
    });
    div.querySelectorAll("[data-p]").forEach(sp => {
      sp.oncontextmenu = (e) => { e.preventDefault(); picked.splice(Number(sp.dataset.p), 1); render(); };
      sp.onclick = () => { picked.splice(Number(sp.dataset.p), 1); render(); };
    });

    // 情报模式推荐的候选：点一下直接合成（数字已是实际编号，不再二次打乱）
    div.querySelectorAll("[data-craft]").forEach(btn => {
      btn.onclick = () => {
        const num = Number(btn.dataset.craft);
        const target = shownDef(num);
        if (!target || (target.grade || 0) < 0) return;
        const need = String(num).padStart(3, "0").split("").map(Number);
        const bagNow = bagDigits();
        const idxs = [];
        for (const v of need){
          const k = bagNow.findIndex((x, i2) => x === v && !idxs.includes(i2));
          if (k < 0){ log(`袋子：数字不够了。`, "sys"); return; }
          idxs.push(k);
        }
        idxs.sort((a, b) => b - a).forEach(k => bagNow.splice(k, 1));
        picked = [];
        grantItem(num, { fromBag:true });
        log(`合成宝袋：合成了「${target.name}」。`,"good");
        closeModal();
        openCraftBag();
        afterStateChange();
      };
    });
    const mk = div.querySelector("#bag-make");
    if (mk) mk.onclick = () => {
      if (picked.length !== 3) return;
      const num = Number(picked.join(""));
      const target = shownDef(num);
      if (!target || (target.grade || 0) < 0) return;
      if (!target){ log(`袋子：没有编号 ${num} 的道具。`,"sys"); return; }
      // 从袋子里删掉对应的三个数字（按值删，各删一个）
      for (const v of picked){
        const idx = bag.indexOf(v);
        if (idx >= 0) bag.splice(idx, 1);
      }
      picked = [];
      grantItem(num, { fromBag:true });      // 走正常映射，拿到的就是图鉴 #num 那件
      log(`合成宝袋：合成了「${target.name}」。`,"good");
      closeModal();
      afterStateChange();
    };
    const cl = div.querySelector("#bag-clear");
    if (cl) cl.onclick = () => { picked = []; render(); };
    const cs = div.querySelector("#bag-close");
    if (cs) cs.onclick = () => closeModal();
  };
  render();
}

/* ---------------- 日志 ---------------- */
/* 日志框滚到最新一条（重绘后的新节点要等一帧才有正确高度） */
/* 日志是否贴在底部（留 24px 容差） */
function logAtBottom(el){
  if (!el) return true;
  return (el.scrollHeight - el.scrollTop - el.clientHeight) <= 24;
}

/* 只有「玩家自己往上滑」才解除吸底。
   判定方式：只有紧跟在真实输入（滚轮 / 拖动 / 触摸 / 按键）之后的 scroll 才算玩家滚动，
   程序设置的 scrollTop 不会改变 logStick，避免重绘后被误判成"玩家上滑"。 */
let logStick = true;
let logLastInput = 0;
function attachLogScroll(el){
  if (!el || el._logBound) return;
  el._logBound = true;
  const mark = () => { logLastInput = Date.now(); };
  el.addEventListener("wheel", mark, { passive: true });
  el.addEventListener("touchmove", mark, { passive: true });
  el.addEventListener("pointerdown", mark);
  el.addEventListener("keydown", mark);
  el.addEventListener("scroll", () => {
    if (Date.now() - logLastInput > 500) return;   // 不是玩家滚的
    logStick = logAtBottom(el);
  });
}
function setLogScroll(el, top){
  if (!el) return;
  el.scrollTop = top;
}
function pinLog(el){
  const b = el || $("#logbox");
  if (!b) return;
  setLogScroll(b, b.scrollHeight);
  const again = () => { const c = $("#logbox"); if (c) setLogScroll(c, c.scrollHeight); };
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(again);
  else setTimeout(again, 16);
}

function scrollLogBottom(){
  if (logStick) pinLog();
}

function log(msg, cls="sys"){
  S.log.push({msg, cls});
  if (S.log.length > 200) S.log.shift();
  const box = $("#logbox");
  if (box){
    attachLogScroll(box);
    const keep = box.scrollTop;
    box.innerHTML = S.log.slice(-60).map(l =>
      `<div class="l ${l.cls}"><span class="t">·</span><span class="m">${l.msg}</span></div>`
    ).join("");
    if (logStick) pinLog(box);
    else setLogScroll(box, keep);
    return;
  }
}

function makeEnemy(n){
  const names = ["史莱姆","骷髅兵","毒蜘蛛","石像鬼","狼人","亡灵法师","炎魔","深渊猎手","冰霜巨像","王国守卫长","混沌之核","虚空之王"];
  const icons = ["🟢","💀","🕷️","🗿","🐺","🧙","🔥","👁️","🧊","🗡️","🌀","👑"];
  const table = (S.hardMode ? ENEMY_HP_HARD : ENEMY_HP);
  const range = table[Math.min(n-1, table.length-1)] || [25,25];
  let hp = range[0] === range[1] ? range[0] : ri(range[0], range[1]);
  // 影分身的追加关卡：固定 [100,300]，不吃平衡系数
  if (n > TOTAL_FLOORS) hp = ri(100, 300);
  // 第一关保持手稿的固定 25，其余按平衡系数缩放
  else if (n > 1) hp = Math.max(1, Math.round(hp * BALANCE.enemyHp));
  // 背刺等：让下一个敌人血量减少 / 增加
  // 「减少下一个敌人的血量」：血量随机完之后再结算，结算完清空
  if (S.nextEnemyReduce){
    hp = Math.max(0, hp - S.nextEnemyReduce);
    S.nextEnemyReduce = 0;
  }
  if (S.nextKill){ S.nextKill = false; hp = 0; }
  const weak = (S.weakBattles || 0) > 0;
  if (weak){ hp = 1; S.weakBattles--; }
  return {
    name: names[(n-1) % names.length] + (n > 12 ? " " + Math.ceil(n/12) : ""),
    icon: icons[(n-1) % icons.length],
    hp, maxHp: hp, idx: n,
    minDmg: 1, maxDmg: 10, weak,
  };
}

function startBattle(idx, elite){
  S.battleElite = !!elite;
  S.battleDmg = 0;   // 单场累计伤害
  S.awaitingContinue = false;
  const enemy = makeEnemy(idx);
  if (elite){ enemy.hp = Math.round(enemy.hp * 1.6); enemy.maxHp = enemy.hp; enemy.elite = true; }
  if (elite) enemy.elite = true;
  const axeNow = false;
  S.battle = {
    enemy, round: 1, attacksLeft: stats().attackCount, skipped: 0,
    elite: !!elite,
    phase: "player", over: false, overflow: 0, dmgDealt: 0,
    flags: {}, temp: {}, roundTemp: {}, attackNo: 0,
    pending: null, rerollUsed: false, lastFormula: null, lastRoll: null,
  };
  S.busy = false;
  log(`⚔️ 第 ${idx} 层 —— ${enemy.name} 出现（${enemy.hp} 点血量）`, "sys");
  // 黑客：不是启动，开场直接把敌人血量压到 5 的倍数
  // 黑客在开战时统一处理（见 hackerCheck）
  // 被背刺/利斧削到 0 血：直接判胜，不进入战斗
  if (enemy.hp <= 0){
    log(`${enemy.name} 还没出手就被削死了。`, "good");
    S.battle = {
      enemy, round: 1, attacksLeft: 0, skipped: 0, phase: "player", over: false,
      overflow: 0, dmgDealt: enemy.maxHp, flags: {}, temp: {}, roundTemp: {}, attackNo: 0,
      pending: null, rerollUsed: false, lastFormula: null, lastRoll: 0, startup: [],
    };
    S.busy = false;
    showScreen("battle");
    renderBattle();
    winBattle(0);
    return;
  }
  // 神力：先放大敌人血量，再结算其它启动效果
  if (S.items.some(i => i.def.id === 336 && !i.spent)){
    enemy.maxHp *= 110; enemy.hp *= 110;
    log(`神力：${enemy.name} 的血量膨胀到 ${enemy.hp}。`, "hurt");
  }
  const beforeStartup = stats();
  fireHook("onBattleStart", {});
  hackerCheck();
  if (S.hp <= 0){ if (resolveDeath()) return; }   // 达摩克里斯之剑这类当场致死的启动效果
  S.battle.startup = startupSummary(beforeStartup, stats());
  S.battle.attacksLeft = stats().attackCount;
  showScreen("battle");
  renderBattle();
}

/* 「启动」在本场战斗里到底改了什么（对比发动前后的属性） */
function startupSummary(a, b){
  const out = [];
  if (b.addDmg !== a.addDmg) out.push(`伤害 ${sgn(b.addDmg - a.addDmg)}`);
  if (b.reduceDmg !== a.reduceDmg) out.push(`减伤 ${sgn(b.reduceDmg - a.reduceDmg)}`);
  if (b.boostDmg !== a.boostDmg) out.push(`增伤 ${sgn(b.boostDmg - a.boostDmg)}`);
  if (b.mult !== a.mult) out.push(`伤害 ×${round2(b.mult / a.mult)}`);
  if (b.luck !== a.luck) out.push(`幸运 ${sgn(b.luck - a.luck)}`);
  if (b.immunity !== a.immunity) out.push(`免伤 ${b.immunity}%`);
  if (b.hpMax !== a.hpMax) out.push(`血量上限 ${sgn(b.hpMax - a.hpMax)}`);
  if (b.attackCount !== a.attackCount) out.push(`攻击次数 ${sgn(b.attackCount - a.attackCount)}`);
  if (b.enemyDmg !== a.enemyDmg) out.push(`敌伤 ${sgn(b.enemyDmg - a.enemyDmg)}`);
  return out;
}

function fireHook(name, ctx){
  const st = stats();
  let guard = 0;
  for (const it of [...S.items]){
    if (++guard > 40) break;
    if (it.spent) continue;
    const h = it.def.hooks && it.def.hooks[name];
    if (typeof h === "function"){
      h(ctx, api(it, st));
      if (it.def.consumeOn === name) destroyItem(it.uid);
    }
    if (ctx && ctx.stop) break;
  }
}

/* ---------------- 道具可用的小工具 ---------------- */
function api(item, st){
  return {
    st, S, item, chance, ri, log,
    enemy: () => (S.battle && !S.battle.over ? S.battle.enemy : null),
    inBattle: () => !!(S.battle && !S.battle.over),
    strike: (n, label, silent) => strike(n, label, silent),
    heal: (n) => healPlayer(n),
    hurt: (n) => hurtPlayer(n),
    gold: (n) => gainGold(n),
    addItem: (id) => grantItem(id, { silent:true }),
    draw: (gradeMin, gradeMax) => randomItemDef(gradeMin, gradeMax),
    promptNum: (title, sub, min, max, cb, def) => promptNumber(title, sub, min, max, cb, def),
    pick: (min, max, cb, title) => pickItem(min, max, cb, title),
    choose: (title, sub, opts, cb) => chooseOne(title, sub, opts, cb),
    openShop: () => openShopFromItem(),
    pickOwned: (title, cb, filter) => pickOwned(title, cb, filter),
    removeItem: (uid) => destroyItem(uid),
    kill: () => { const e = (S.battle && !S.battle.over) ? S.battle.enemy : null;
                  if (!e) return false; e.hp = 0; winBattle(0); return true; },
    perm: (k, n) => {
      if (S.noDecrease && n < 0) return;        // 无瑕圣心：属性不再下降
      if (k === "mult"){ S.perm.mult = (S.perm.mult ?? 1) * n; }
      else S.perm[k] = (S.perm[k]||0) + n;
      // 血量上限提升时同步回血
      if (k === "hpMax" && n > 0) S.hp += n;
      // 记录这件道具自己带来的永久成长，用于在描述里显示
      if (item && n > 0 && k !== "mult"){
        item.grown = item.grown || {};
        item.grown[k] = (item.grown[k] || 0) + n;
      }
    },
    /* 只加属性、不附带回血（空洞心这类） */
    permRaw: (k, n) => {
      if (S.noDecrease && n < 0) return;
      if (k === "mult"){ S.perm.mult = (S.perm.mult ?? 1) * n; }
      else S.perm[k] = (S.perm[k]||0) + n;
      // 记录这件道具自己带来的永久成长，用于在描述里显示
      if (item && n > 0 && k !== "mult"){
        item.grown = item.grown || {};
        item.grown[k] = (item.grown[k] || 0) + n;
      }
    },
    temp: (k, n) => { if (S.battle) S.battle.temp[k] = (S.battle.temp[k]||0) + n; },
    // 回合内属性：只在本回合有效，进入下一回合时清空（用于写明「本回合 / 这回合」的效果）
    tempRound: (k, n) => { if (S.battle) S.battle.roundTemp[k] = (S.battle.roundTemp[k]||0) + n; },
    destroySelf: () => destroyItem(item.uid),
    spend: () => spendItem(item),
    once: (flag) => { if (S.battle){ if (S.battle.flags[flag]) return false; S.battle.flags[flag] = true; } return true; },
    clearAdd: () => { S.battle && (S.battle.temp.addDmg = -stats().addDmg + (S.battle.temp.addDmg||0)); },
  };
}

function randomItemDef(lo, hi){
  const pool = ITEMS.filter(d => d.id > 0 && d.draw !== false && (!lo && !hi || true) && d.grade >= (lo||0) && d.grade <= (hi??5));
  return pool[ri(0, pool.length-1)] || null;
}

/* 直接对敌人造成伤害（道具、启动效果等）。
   会走「造成伤害时 / 造成伤害后」这套词条，但用深度上限防止道具之间无限连锁 */
function strike(n, label, silent){
  const B = S.battle;
  if (!B || B.over || n <= 0) return;
  const e = B.enemy;
  const depth = S._strikeDepth || 0;

  // 道具/启动效果造成的伤害也吃「增伤」
  const boost = (stats().boostDmg || 0);
  let dmg = Math.max(0, Math.round(n + boost));
  if (depth < 3){
    S._strikeDepth = depth + 1;
    try {
      const c = { dmg, raw: dmg, hitEnemy: true };
      fireHook("onDealDamage", c);
      dmg = Math.max(0, Math.round(c.dmg));
      const before = e.hp;
      e.hp = Math.max(0, e.hp - dmg);
      B.dmgDealt += dmg;
      if (!silent) addLog(`${label ? label + " · " : ""}对 ${e.name} 造成 ${dmg} 点伤害（${before} → ${e.hp}）`, "hit");
      hackerCheck();
  if (dmg > 0) fireHook("onAfterHit", { dmg, raw: Math.round(n), hitEnemy: true });
      if (e.hp <= 0){
        S._strikeDepth = 0;
        winBattle(Math.max(0, dmg - before));
        return;
      }
      if (!silent) renderBattle();
    } finally {
      S._strikeDepth = 0;
    }
    return;
  }

  // 连锁太深：只结算伤害，不再触发词条
  const before = e.hp;
  e.hp = Math.max(0, e.hp - dmg);
  B.dmgDealt += dmg;
  if (!silent) addLog(`${label ? label + " · " : ""}对 ${e.name} 造成 ${dmg} 点伤害（${before} → ${e.hp}）`, "hit");
  if (e.hp <= 0) winBattle(Math.max(0, dmg - before));
  else if (!silent) renderBattle();
}

function healPlayer(n){
  if (stats().noHeal) return;
  const st = stats();
  const amt = Math.round(n * (st.healMult || 1));
  const cap = st.healOvercap ? 9999 : maxHp();
  const before = S.hp;
  // 已经超过上限的血量保留，只夹「治疗带来的部分」
  S.hp = Math.max(S.hp, Math.min(cap, S.hp + amt));
  if (S.hp !== before) addLog(`回复 ${S.hp - before} 点血量（${S.hp}/${maxHp()}）`, "good");
}

/* 金币下限：每张信用卡 -20（可叠加），没有则不能为负 */
function goldFloor(){
  const n = S.items.filter(i => i.def.id === 355 && !i.spent).length;
  return n ? -20 * n : 0;
}
/* 是否付得起 n 金币（有信用卡时可以先花到负数） */
function canPay(n){ return S.gold - n >= goldFloor(); }   // 信用卡决定能欠多少（默认 0）

/* 花金币：不稳定促销会把这次的消耗量随机乘 [0,2] 倍 */
function spendGold(cost){
  let pay = Math.max(0, Math.round(cost));
  if (S.items.some(i => i.def.id === 173)){
    const m = ri(0, 2);
    pay = Math.round(pay * m);
    log(`不稳定促销：本次消耗 ${pay} 金币（原价 ${cost}）`, m === 0 ? "good" : (m > 1 ? "hurt" : "sys"));
  }
  S.gold = Math.max(goldFloor(), S.gold - pay);   // 只能花到信用卡允许的下限
  // 泡沫经济：花掉的这部分就不用还了
  if (S.bubbleDebt > 0) S.bubbleDebt = Math.max(0, S.bubbleDebt - pay);
  fireHook("onSpend", { amount: pay });
  return pay;
}

/* 主动扣血（道具代价）：会触发「失去血量时」类道具，但不算被攻击 */
function spendHp(n){
  const before = S.hp;
  S.hp = Math.max(0, S.hp - n);
  const lost = before - S.hp;
  if (lost > 0){
    // 卖血袋这类「代价是失去血量」的主动，也算一次受伤
    if (S.battle && !S.battle.over) fireHook("onHurt", { dmg: lost, self: true });
    fireHook("onLoseHp", { amt: lost });
  }
  return S.hp <= 0;
}

function hurtPlayer(n, opts={}){
  const B = S.battle;
  const before = S.hp;
  S.hp = Math.max(0, S.hp - n);
  addLog(`你失去了 ${before - S.hp} 点血量（${S.hp}/${maxHp()}）`, "hurt");
  if (B && !B.over) fireHook("onHurt", { dmg: n });
  if (before > S.hp) fireHook("onLoseHp", { amt: before - S.hp });
  return S.hp <= 0;
}

function gainGold(n){
  const st = stats();
  let amt = Math.round(n * (st.goldDouble ? 2 : 1));
  if (S.noGoldGain || st.noGoldGain) amt = -Math.abs(amt);
  {
    let g = S.gold + amt;
    if (g > st.goldCap) g = st.goldCap;            // 上限只限制正数
    if (g < goldFloor()) g = goldFloor();          // 下限由信用卡决定（默认 0）
    S.gold = g;
  }
  if (amt > 0) S.totalGold += amt;
  if (amt) addLog(amt > 0 ? `获得 ${amt} 金币（${S.gold}/${st.goldCap}）` : `失去 ${-amt} 金币`, amt > 0 ? "gold" : "hurt");
  fireHook("onGoldGain", { amt });
}


function destroyItem(uid, silent){
  S.cDestroy = (S.cDestroy || 0) + 1;
  const i = S.items.findIndex(x => x.uid === uid);
  if (i >= 0){
    const itm = S.items[i];
    S.items.splice(i, 1);
    if (!silent) addLog(`「${itm.def.name}」已销毁`, "item");
    if (grantDepth < 6){
      grantDepth++;
      fireHook("onConsume", { item: itm });
      grantDepth--;
    }
  }
}

/* 用尽（不销毁，留在道具栏里显示为灰色，不再提供任何效果） */
function spendItem(it){
  if (!it || it.spent) return;
  it.spent = true;
  addLog(`「${itName(it)}」已用尽`, "item");
}

function addLog(msg, cls){ log(msg, cls); }

function popNum(text, color, side){
  const host = $(side === "enemy" ? "#enemy-card" : "#player-card");
  if (!host) return;
  const el = document.createElement("div");
  el.className = "pop-num";
  el.textContent = text;
  el.style.color = color;
  el.style.left = side === "enemy" ? "58%" : "46%";
  el.style.top = "46%";
  host.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function shake(sel){
  const el = $(sel);
  if (!el) return;
  el.classList.remove("shake");
  void el.offsetWidth;
  el.classList.add("shake");
}

/* 玩家一次攻击 —— 先生成随机数，再结算（小明可以在生成后选择刷新） */
function playerAttack(){
  const B = S.battle;
  if (!B || B.over || S.busy || B.attacksLeft <= 0) return;
  if (B.phase !== "player") return;
  if (B.pending) return;
  S.busy = true;

  const st = stats();
  const c = { B, dmg: 0, value: 0, steps: [], canceled: false, st };
  fireHook("onAttackWindup", c);          // 「攻击时」：随机数生成之前

  if (c.canceled || c.handled){
    B.attacksLeft--;
    S.busy = false;
    addLog(c.handled ? "这次攻击由道具直接结算了。" : "你的攻击落空了。", "sys");
    if (S.battle && !S.battle.over){
      if (B.attacksLeft <= 0) endPlayerPhase();
      else renderBattle();
    }
    return;
  }

  const lo = c.forceLo ?? st.minDmg;
  const hi = c.forceHi ?? st.maxDmg;
  B.lastRoll = (B.payWin || S.forcedRoll) ? (S.forcedRoll || hi) : ri(lo, hi);
  B.lastFormula = null;
  S.battleDmg = 0;
  S.busy = false;

  // 「刷新」能力由开局的角色能力道具提供
  if (hasAbility(-1) && !B.rerollUsed){
    B.pending = { c, lo, hi };
    B.phase = "pending";
    addLog(`计算器生成 ${B.lastRoll}。可以刷新一次，或直接攻击。`, "sys");
    renderBattle();
    return;
  }
  resolveRolledAttack(c);
}

function rerollPending(){
  const B = S.battle;
  if (!B || !B.pending) return;
  B.lastRoll = ri(B.pending.lo, B.pending.hi);
  B.rerollUsed = true;
  addLog(`刷新后生成 ${B.lastRoll}。`, "sys");
  renderBattle();
}

function confirmPending(){
  const B = S.battle;
  if (!B || !B.pending) return;
  const c = B.pending.c;
  B.pending = null;
  B.phase = "player";
  resolveRolledAttack(c);
}

function resolveRolledAttack(c){
  const B = S.battle;
  if (!B || B.over) return;
  const st = c.st || stats();
  // 石化 / 解石化：锁定计算器的数字
  if (S.forcedRoll){ B.lastRoll = S.forcedRoll; }
  const roll = B.lastRoll;
  c.value = roll;

  fireHook("onRollDamage", c);             // 随机数已生成，尚未结算（倍率、额外随机数）
  let v = c.value;
  const steps = (c.steps || []).slice();

  const m = (st.mult || 1) * (c.mult ?? 1);
  if (S.hardMode){
    // 高难模式：乘法先结算，加伤最后加
    if (m !== 1){ v = v * m; steps.push(`×${round2(m)}`); }
    if (st.addDmg){ v += st.addDmg; steps.push(`${sgn(st.addDmg)} 加伤`); }
  } else {
    if (st.addDmg){ v += st.addDmg; steps.push(`${sgn(st.addDmg)} 加伤`); }
    if (m !== 1){ v = v * m; steps.push(`×${round2(m)}`); }
  }
  if (c.bonus){ v += c.bonus; steps.push(`${sgn(c.bonus)}`); }
  if (st.boostDmg){ v += st.boostDmg; steps.push(`${sgn(st.boostDmg)} 增伤`); }
  v = Math.max(0, v);

  const dc = { dmg: v, raw: roll, addDmg: st.addDmg };
  fireHook("onDealDamage", dc);
  let dmg = Math.max(0, Math.round(dc.dmg));
  if (dmg !== Math.round(v)) steps.push(`→${dmg}`);

  // 幸运星：打出的是计算器生成的那个数字
  if (S.luckyStar && S.luckyStar === roll){
    steps.push("幸运星·秒杀");
    addLog(`幸运星命中！计算器打出 ${roll}`, "good");
    dmg = Math.max(dmg, B.enemy.hp);
  }

  B.lastFormula = { roll, steps, final: dmg, mult:m, addDmg:st.addDmg };
  if ((S.maxHit || 0) < dmg) S.maxHit = dmg;
  S.cAttack = (S.cAttack || 0) + 1;
  S.battleDmg = (S.battleDmg || 0) + dmg;
  try { checkAchievements(); } catch(e){}   // 单次/单场伤害类成就要在命中瞬间判定
  B.attacksLeft--;
  B.attackNo = (B.attackNo || 0) + 1;
  S.busy = false;

  applyPlayerDamage(dmg, roll, c);

  if (S.battle && !S.battle.over && S.hp <= 0){
    if (!checkPlayerDeath()){
      renderBattle();
      setTimeout(() => gameOver(), 450);
    }
  }
}

function round2(n){ return Math.round(n * 100) / 100; }
function sgn(n){ return n > 0 ? "+" + n : String(n); }

function applyPlayerDamage(dmg, raw, c){
  const B = S.battle;
  if (!B || B.over) return;
  const e = B.enemy;
  const before = e.hp;
  e.hp = Math.max(0, e.hp - dmg);
  B.dmgDealt += dmg;

  hackerCheck();
  const f = B.lastFormula;
  const steps = f && f.steps && f.steps.length ? ` ${f.steps.join(" ")}` : "";
  addLog(`你发动攻击：随机数 ${raw}${steps} = ${dmg} 点伤害（敌人 ${before} → ${e.hp}）`, "hit");

  fireHook("onAfterHit", { dmg, raw, hitEnemy:true });

  popNum("-" + dmg, "#f0a09a", "enemy");
  shake("#enemy-card");
  const bar = $("#enemy-hp-bar");
  if (bar) bar.classList.add("hp-flash");

  if (e.hp <= 0){
    const over = Math.max(0, dmg - before);
    B.overflow += over;
    winBattle(over);
    return;
  }

  // 检查是否还有攻击次数
  if (B.attacksLeft <= 0) endPlayerPhase();
  else renderBattle();
}

function endPlayerPhase(){
  const B = S.battle;
  if (B.over) return;
  if (B.attacksLeft <= 0 && B.skipped === stats().attackCount){
    // 全部选择「不攻击」
    B.skippedAll = true;
    log("你放弃了这一轮的全部攻击。", "sys");
    fireHook("onNoAttack", { B });
    if (B.over) return;
  }
  B.phase = "enemy";
  renderBattle();
  S.busy = true;
  setTimeout(() => enemyTurn(), 420);
}

function enemyTurn(){
  const B = S.battle;
  if (!B || B.over) return;
  const st = stats();
  const e = B.enemy;

  const c = { B, value: 0, dmg: 0, canceled: false, st, immune:false };
  // 「不攻击时免疫伤害」在敌人的回合判定
  if (B.skippedAll) fireHook("onEnemyTurnNoAttack", c);
  fireHook("onEnemyAttack", c);
  if (c.canceled || c.immune){
    addLog(c.immune ? `${e.name} 的攻击被你免疫了。` : `${e.name} 的攻击被抵挡了。`, "good");
    S.busy = false;
    if (S.battle && !S.battle.over) nextRound();
    return;
  }

  let raw = c.forceValue != null ? c.forceValue : ri(e.minDmg, e.maxDmg) + st.enemyDmg;
  if (c.forceValue == null && S.enemyLock) raw = S.enemyLock;   // 反石化
  raw = c.forceValue != null ? raw : Math.round(raw * st.enemyMult);
  raw = Math.max(0, raw - st.reduceDmg);        // 减伤
  let dmg = raw;
  const dc = { dmg, raw };
  fireHook("onEnemyDamage", dc);
  dmg = Math.max(0, Math.round(dc.dmg));

  // 免伤
  if (dmg > 0 && st.immunity > 0 && chance(st.immunity / 100)){
    addLog(`你免疫了 ${dmg} 点伤害。`, "good");
    dmg = 0;
  }
  // 金盾：抵挡一次伤害
  if (dmg > 0 && (S.shield || 0) > 0){
    S.shield--;
    addLog(`金盾挡下了这次伤害（剩余 ${S.shield} 次）。`, "good");
    dmg = 0;
  }

  const before = S.hp;
  S.hp = Math.max(0, S.hp - dmg);
  if (dmg > 0) addLog(`${e.name} 反击：${dmg} 点伤害（你 ${before} → ${S.hp}）`, "hurt");
  else addLog(`${e.name} 反击，但没能伤到你。`, "good");
  if (dmg > 0) popNum("-" + dmg, "#e07a7a", "player");
  shake(".combatant.player");
  S.busy = false;

  // 受到伤害：先触发「受伤时」道具（荆甲、咒怨术、荆棘…），再结算后续
  fireHook("onHurt", { dmg, raw });
  fireHook("onAfterHurt", { dmg, raw });
  if (S.battle && S.battle.over) return;

  const bar = $("#player-hp-bar");
  if (bar) bar.classList.add("hp-flash");

  if (S.hp <= 0){
    if (checkPlayerDeath()){
      renderBattle();
      nextRound();
      return;
    }
    renderBattle();
    setTimeout(() => gameOver(), 500);
    return;
  }
  nextRound();
}

/* 返回 true 表示被道具救活了 */
function checkPlayerDeath(){
  const beforeRevive = S.hp;
  const rc = { saved:false, hpAfter: 0 };
  fireHook("onLethal", rc);
  if (rc.saved){
    S.hp = Math.max(1, rc.hpAfter || 1);
    addLog(`死亡的命运被改写了，你以 ${S.hp} 点血量站了起来。`, "good");
    return true;
  }
  return false;
}

/* 血量归零时统一结算：先给复活道具机会，再判负。战斗内外都走这里 */
function resolveDeath(){
  if (S.hp > 0) return false;
  if (S.battle && S.battle.over) { /* 战斗已结束，仍需判定 */ }
  closeModal();
  if (checkPlayerDeath()){
    if (S.battle && !S.battle.over) renderBattle();
    else afterStateChange();
    return false;
  }
  if (S.battle) S.battle.over = true;
  gameOver();
  return true;
}

function nextRound(){
  const B = S.battle;
  if (!B || B.over) return;
  B.round++;
  B.roundTemp = {};          // 「本回合」类效果在这里失效
  B.hitCount = 0;
  fireHook("onRoundStart", { B });
  if (B.over) return;
  B.phase = "player";
  B.attacksLeft = stats().attackCount;
  B.skipped = 0;
  B.pending = null;
  B.rerollUsed = false;
  B.skippedAll = false;
  B.payWin = false;
  S.busy = false;
  renderBattle();
}

/* 黑客：把敌人血量与上限压到「最近的更小的 5 的倍数」，每次血量变动后调用 */
function hackerCheck(){
  const B = S.battle;
  if (!B || B.over || !B.enemy) return;
  if (!S.items.some(i => i.def.id === 310 && !i.spent)) return;
  const e = B.enemy;
  if (e.hp <= 0) return;
  const v = Math.max(5, Math.floor(e.hp / 5) * 5);
  if (v !== e.hp){
    addLog(`黑客：${e.name} 的血量被压到 ${v}`, "item");
    e.hp = v;
  }
  if (e.maxHp > v) e.maxHp = v;
}

function winBattle(overflow){
  if (S.hp === 1) S.cLow1Win = (S.cLow1Win || 0) + 1;
  if (S.hp <= 3) S.cLow3Win = (S.cLow3Win || 0) + 1;
  const B = S.battle;
  if (!B || B.over) return;
  B.over = true;
  const st = stats();
  fireHook("onKill", { over: overflow, enemy: B.enemy });

  let gold = overflow + (st.goldBonus || 0);
  // 荣誉击杀：刚好击杀或只溢出 1~2 点，额外 +3 金币
  const honor = overflow >= 0 && overflow <= 2;
  gold = Math.round(gold * (st.goldDouble ? 2 : 1));
  if (S.noGoldGain || st.noGoldGain) gold = 0;
  if (honor) gold += 3;
  S.gold = Math.min(st.goldCap, S.gold + gold);
  S.totalGold += gold;
  S.totalKills++;
  if (honor) addLog(`荣誉击杀！溢出伤害仅 ${overflow} → 额外 +3 金币`, "good");
  addLog(`击败 ${B.enemy.name}！溢出伤害 ${overflow} → 获得 ${gold} 金币`, "gold");
  if (gold > 0) fireHook("onGoldGain", { amt: gold });
  popNum("+" + gold + "💰", "#e8c46a", "enemy");

  healPlayer(st.heal);                       // 里层已经会写「回复 N 点血量」

  // 透支：本关结束扣除回复的血量
  if (S.overdraft){
    const od = S.overdraft; S.overdraft = 0;
    S.hp = Math.max(1, S.hp - od);
    addLog(`透支结算：失去 ${od} 点血量（${S.hp}/${maxHp()}）`, "hurt");
  }
  // 负债：以 2 倍偿还
  if (S.debt){
    const d = S.debt; S.debt = 0;
    // 负债是「借了必须还」，钱不够就扣成负数（信用卡另算下限）
    S.gold = S.gold - d;
    addLog(`负债结算：偿还 ${d} 金币（剩 ${S.gold}）`, "hurt");
  }

  fireHook("onBattleEnd", { B, gold });
  if (S.goldenChild > 0) S.goldenChild--;
  S.depth = B.enemy.idx;
  renderBattle();

  setTimeout(() => {
    if (S.pendingDeath && S.hp <= 0){ gameOver(); return; }
    if (S.pendingDeath){ gameOver(); return; }
    if (S.depth >= lastFloor()){ victory(); return; }
    if (S.autoNext){
      advanceNode();                      // 自动：直接前往下一个节点
    } else {
      // 手动：停在击杀敌人的界面，等玩家点「继续前进」
      S.awaitingContinue = true;
      renderBattle();
    }
  }, 900);

  try { checkAchievements(); } catch(e){}   // 打赢后立刻判定成就（这条路径不走 afterStateChange）
}

/* 击杀后手动离开战斗界面 */
function afterBattleContinue(){
  if (!S.awaitingContinue) return;
  S.awaitingContinue = false;
  clearTimeout(S.autoTimer);
  if (S.depth >= lastFloor()){ victory(); return; }
  advanceNode();
}

/* ============================================================
   地图与流程
   ============================================================ */
const TOTAL_FLOORS = 12;
const SHADOW_FLOORS = 24;          // 影分身：12 关之后再追加 12 关

/* 当前这一局的最后一层（有影分身时是 24，否则 12） */
function lastFloor(){
  for (let i = S.map.length - 1; i >= 0; i--){
    if (S.map[i] && S.map[i].type === "enemy") return S.map[i].idx;
  }
  return TOTAL_FLOORS;
}

/* 影分身：在 12 关之后追加 12 关（每关后面跟一个宝箱作为奖励，可跳过） */
/* 敌人血量表（手稿：普通模式 12 关） */
const ENEMY_HP = [
  [25,25], [30,35], [35,40], [40,50], [50,60], [60,75],
  [70,90], [85,120], [100,150], [120,180], [150,200], [200,400],
];
/* 高难模式血量表（解锁后可选） */
const ENEMY_HP_HARD = [
  [25,25], [35,45], [50,65], [70,90], [95,120], [125,160],
  [165,210], [215,270], [280,350], [360,450], [470,580], [500,800],
];

/* 相邻两行的连线：上面的节点连到它左下/右下的孩子，
   下面的节点也可以同时被左上/右上的父节点连到（多父节点）。
   用「按比例分摊」的方式分配，层级越多自然形成菱形/树状。 */
function linkRows(parents, childs, nodes){
  const P = parents.length, C = childs.length;
  const nexts = parents.map(() => []);
  const addEdge = (i, j) => {
    const pid = parents[i], cid = childs[j];
    if (!nexts[i].includes(cid) && nexts[i].length < 2) nexts[i].push(cid);
  };

  // 父 -> 子：每个父节点覆盖它下方的那一段
  for (let i = 0; i < P; i++){
    const j0 = Math.min(C - 1, Math.floor(i * C / P));
    const j1 = Math.min(C - 1, Math.max(j0, Math.ceil((i + 1) * C / P) - 1));
    addEdge(i, j0);
    if (j1 !== j0) addEdge(i, j1);
  }
  // 子 -> 父：每个子节点至少被上面一个（通常是两个）父节点连到
  for (let j = 0; j < C; j++){
    const i0 = Math.min(P - 1, Math.floor(j * P / C));
    const i1 = Math.min(P - 1, Math.max(i0, Math.ceil((j + 1) * P / C) - 1));
    addEdge(i0, j);
    if (i1 !== i0) addEdge(i1, j);
  }
  // 兜底：没有孩子的父节点连到最近的孩子
  for (let i = 0; i < P; i++){
    if (nexts[i].length) continue;
    const j = Math.max(0, Math.min(C - 1, Math.round((i + 0.5) / P * C - 0.5)));
    nexts[i].push(childs[j]);
  }
  parents.forEach((pid, i) => { nodes[pid].next = nexts[i]; });
}

function buildMap(){
  const floors = clamp(S.floors || TOTAL_FLOORS, 3, 24);
  const nodes = [];
  const rows = [];

  const addNode = (r, type) => {
    const n = { id: nodes.length, row: r, type, next: [] };
    nodes.push(n);
    return n.id;
  };
  const nonCombat = () => {
    const r = rnd();
    return r < 0.34 ? "chest" : (r < 0.60 ? "shop" : (r < 0.80 ? "campfire" : "event"));
  };

  // 行宽：从 1 开始逐行变宽，最多 5 个（岔路越多，行越宽，但不会失控）
  const widths = [1, 2];
  // 行数 = 关卡数（每行都有一个战斗节点，最后一行是 BOSS）
  for (let r = 2; r < floors; r++){
    let w;
    if (r <= 3){
      // 前几行固定变宽，避免整张图只有 1~2 列
      w = r + 1;
    } else {
      const grow = rnd();
      w = widths[r-1] + (grow < 0.42 ? 1 : (grow < 0.90 ? 0 : -1));
    }
    w = Math.max(1, Math.min(8, w));
    widths.push(w);
  }
  // 兜底：整张图至少 4 列宽（关卡数太少时按行数收敛）
  if (Math.max.apply(null, widths) < 4){
    for (let r = 1; r < widths.length; r++){
      widths[r] = Math.max(widths[r], Math.min(4, r + 1));
    }
  }
  const rowCount = widths.length;

  // 先把所有格子铺成非战斗，再按「隔行」把战斗塞进去，保证总场数 = 关卡数
  for (let r = 0; r < rowCount; r++){
    const isLast = (r === rowCount - 1);
    const w = isLast ? 1 : widths[r];
    const row = [];
    for (let k = 0; k < w; k++) row.push(addNode(r, "enemy"));
    if (isLast) nodes[row[0]].boss = true;
    rows.push(row);
  }
  // 先连线，再按「可达性」分配节点类型：保证每个战斗节点都在玩家必经的路上
  for (let r = 0; r < rows.length - 1; r++){
    linkRows(rows[r], rows[r+1], nodes);
  }

  // 逐行推算可达集合
  const reachRows = [];
  {
    let cur = new Set(rows[0]);
    reachRows.push(cur);
    for (let r = 0; r < rows.length - 1; r++){
      const nx = new Set();
      for (const id of cur) for (const c of nodes[id].next) nx.add(c);
      reachRows.push(nx);
      cur = nx;
    }
  }

  // 分配类型：第 0 行战斗、每两行一个战斗、最后一行 BOSS
  let enemyNo = 0;
  for (let r = 0; r < rows.length; r++){
    const row = rows[r];
    const isLast = (r === rows.length - 1);
    const keepCombat = true;   // 每一行都要有一个战斗节点
    let combatId = -1;
    if (r === 0 || isLast){
      combatId = row[0];
    } else if (keepCombat){
      // 在本行「可达」的节点里随机挑一个当战斗
      const cand = row.filter(id => reachRows[r].has(id));
      const pool = cand.length ? cand : row;
      combatId = pool[ri(0, pool.length - 1)];
    }
    for (const id of row){
      if (id === combatId){
        nodes[id].type = "enemy";
        nodes[id].idx = ++enemyNo;
        // 精英：前 3 行不生成，其余 20% 概率
        if (r >= 3 && !isLast && rnd() < 0.2) nodes[id].elite = true;
      } else {
        nodes[id].type = nonCombat();
      }
    }
    if (isLast) nodes[row[0]].boss = true;
  }

  for (const n of nodes) if (n.type === "enemy" && !n.idx) n.idx = ++enemyNo;

  S.map = nodes;
  S.mapRows = rows;
  S.reach = rows[0].slice();
  S.nodeIdx = -1;
  S.depth = 0;
}

/* 影分身：在末尾接一段新的树（12 关） */
function extendMapForShadow(){
  if (!S.map || !S.mapRows) return;
  let lastEnemy = 0;
  for (const n of S.map) if (n.type === "enemy") lastEnemy = Math.max(lastEnemy, n.idx);
  const target = (S.floors || TOTAL_FLOORS) + 12;
  if (lastEnemy >= target) return;

  const rows = S.mapRows;
  const oldBoss = rows[rows.length - 1][0];
  S.map[oldBoss].boss = false;

  const nonCombat = () => {
    const r = rnd();
    return r < 0.34 ? "chest" : (r < 0.60 ? "shop" : (r < 0.80 ? "campfire" : "event"));
  };
  const addNode = (r, type) => {
    const n = { id: S.map.length, row: r, type, next: [] };
    S.map.push(n);
    return n.id;
  };

  const newRows = [];
  let prevRow = rows[rows.length - 1];
  let added = 0, step = 0;
  while (added < 12 && step++ < 200){
    const w = Math.max(1, Math.min(6, prevRow.length + (rnd() < 0.5 ? 1 : 0)));
    const combatRow = (step % 2 === 0);
    const row = [];
    let placed = false;
    for (let k = 0; k < w; k++){
      const type = (combatRow && !placed) ? "enemy" : nonCombat();
      if (type === "enemy") placed = true;
      row.push(addNode(rows.length, type));
    }
    rows.push(row);
    newRows.push(row);
    if (placed) added++;
    prevRow = row;
  }

  S.map[oldBoss].next = newRows[0].slice();
  for (let i = 0; i < newRows.length - 1; i++){
    linkRows(newRows[i], newRows[i + 1], S.map);
  }
  S.map[newRows[newRows.length - 1][0]].boss = true;

  let enemyNo = 0;
  for (const n of S.map) if (n.type === "enemy") n.idx = ++enemyNo;
  log("影分身：地牢在 12 关之后又向下延伸了 12 关。", "good");
}

let grantDepth = 0;

/* 合同：持有期间，道具库里编号 1~28 的道具会被改写成对应角色的能力（-1 ~ -28） */

/* 显示用的道具定义：持有合同时，1~28 号显示成对应角色的能力 */
function shownDef(id){
  const n = Number(id);
  const hasContract = S.items && S.items.some(i => i.def && i.def.id === -30 && !i.spent);
  if (hasContract && n >= 1 && n <= CHARS.length){
    const ab = ITEM_BY_ID.get(-n);
    if (ab) return ab;
  }
  // 宝袋重排过编号：图鉴 / 商店 / 宝箱都显示重排后的道具
  return ITEM_BY_ID.get(shuffledId(n)) || ITEM_BY_ID.get(n);
}


/* ============================================================
   本局道具编号重排（合成宝袋的效果）
   S.shuffleMap: 编号 -> 实际道具编号
   ============================================================ */
function shuffleItemIds(){
  // 控制台(299)不参与打乱：它是工具，不该被换成别的道具
  const ids = ITEMS.filter(i => i.id > 0 && i.id !== 299 && (i.grade || 0) >= 0).map(i => i.id);
  const pool = ids.slice();
  // Fisher-Yates
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  const map = {};
  ids.forEach((id, k) => { map[id] = pool[k]; });
  S.shuffleMap = map;
  return map;
}

function shuffleActive(){ return !!(S.shuffleMap && Object.keys(S.shuffleMap).length); }

/* 把一个「图鉴上的编号」翻译成实际道具编号 */

/* 实际道具编号 -> 图鉴上的编号（打乱之后的反向查询） */
function inverseShuffle(actualId){
  if (!shuffleActive()) return actualId;
  for (const k in S.shuffleMap){
    if (S.shuffleMap[k] === actualId) return Number(k);
  }
  return actualId;
}

function shuffledId(id){
  if (!shuffleActive()) return id;
  const n = Number(id);
  if (S.shuffleMap[n] != null && n > 0) return S.shuffleMap[n];
  return id;
}

function contractRewrite(id){
  const n = Number(id);
  if (!(n >= 1 && n <= CHARS.length)) return id;
  if (!S.items || !S.items.some(i => i.def && i.def.id === -30 && !i.spent)) return id;
  return -n;
}

function grantItem(id, opts={}){
  // 特别周：下一次获得的道具必定是 4 级
  if (S.nextItemGrade != null && !opts.allowDup){
    const g = S.nextItemGrade;
    S.nextItemGrade = null;
    const gd = randomItemDef(g, g);
    if (gd) id = gd.id;
  }
  const slotNo = id;            // 玩家实际点的那个编号（图鉴上的编号）
  // 合同：把编号 1~28 的道具改写为对应角色能力
  id = contractRewrite(id);
  // 宝袋重排：编号 N 实际给的是图鉴上显示的那件
  if (id > 0 && !opts.rawId) id = shuffledId(id);
  const def = ITEM_BY_ID.get(id);
  if (!def) return null;
  // 「只能持有 1 个」的道具：重复获得时改为其它道具
  if (def.unique && S.items.some(x => x.def.id === def.id) && !opts.allowDup){
    log(`「${def.name}」只能持有一个，改为获得其它道具。`, "sys");
    const alt = randomItemDef(0, 4);
    if (alt && alt.id !== def.id) return grantItem(alt.id, { silent: opts.silent });
    return null;
  }
  const it = { uid: S.uidSeq++, def, isNew:!opts.silent, num: slotNo };
  const hpMaxBefore = maxHp();
  S.items.push(it);
  // 血量上限增加时，同步回复等量血量
  const hpMaxAfter = maxHp();
  if (hpMaxAfter > hpMaxBefore){
    S.hp += (hpMaxAfter - hpMaxBefore);
    addLog(`血量上限 +${hpMaxAfter - hpMaxBefore}，同时回复等量血量（${S.hp}/${hpMaxAfter}）`, "good");
  }
  if (grantDepth > 8) return it;
  // 合成宝袋：把编号拆成 3 个数字存进去（宝袋自己给的道具除外）
  const isCain = !!(S.char && S.char.key === "cain");
  let eaten = false;                 // 被合成宝袋吃掉的道具不应再生效
  if (isCain && !opts.fromBag && !opts.fromConsole && id > 0 && id !== 299 && slotNo !== 299){
    try {
      if (bagStoreItem(id)){
        // 里该隐：道具直接被袋子吃掉，不留在身上；日志只报拆出来的数字
        destroyItem(it.uid, true);
        eaten = true;
        const str = String(id).padStart(3, "0").slice(-3);
        log(`获得了 ${str.split("").join("、")} 数字`, "item");
      }
    } catch(e){}
  }
  grantDepth++;
  try {
    if (!eaten && def.hooks && def.hooks.onAcquire){
      def.hooks.onAcquire({}, api(it, stats()));
      if (def.consumeOn === "onAcquire") destroyItem(it.uid);
    }
    if (!eaten && grantDepth <= 6) fireHook("onItemGain", { def });
  } finally {
    grantDepth--;
  }
  // 二舅：获得道具量翻倍
  if (!opts.silent && !opts.noDup && grantDepth === 0 && stats().itemDouble){
    grantItem(id, { silent:true, noDup:true });
  }
  return it;
}

function advanceNode(){
  // 精英敌人结算：先开一次宝箱，再继续前进
  if (S.battleElite){
    S.battleElite = false;
    addLog("精英敌人掉落了宝箱！","good");
    enterChest();
    return;
  }
  // 节点结束（567 的「每通过一个节点 +1 刀片」等挂在这里）
  try { fireHook("onNodeEnd", {}); } catch(e){}
  settleBubble();          // 泡沫经济：进入下一关时收回
  const cur = S.map[S.nodeIdx];
  if (cur && !(S.mapDone || []).includes(S.nodeIdx)){
    S.mapDone = (S.mapDone || []).concat([S.nodeIdx]);
  }
  let next = cur ? (cur.next || []) : [];
  if (S.items.some(i => i.def.id === 453 && !i.spent)){
    // 飞鞋：下一整行都能去
    const nextRow = (cur ? cur.row : -1) + 1;
    const rowIds = (S.mapRows || []).filter(r => r.length && S.map[r[0]].row === nextRow)[0];
    if (rowIds && rowIds.length > 1){ next = rowIds.slice(); log("飞鞋：你可以前往下一行的任意节点。", "item"); }
  }
  if (!next.length){ victory(); return; }   // 打完 BOSS
  S.reach = next.slice();
  showScreen("map");
  renderMap();
}

/* 泡沫经济：把这笔金币收回去，期间花掉多少就少收多少 */
function settleBubble(){
  if (!(S.bubbleDebt > 0)) return;
  const debt = S.bubbleDebt;
  S.bubbleDebt = 0;
  S.gold = S.gold - debt;
  addLog(`泡沫经济破裂：收回 ${debt} 金币（剩 ${S.gold}）`, "hurt");
  const it = S.items.find(i => i.def.id === 72);
  if (it) destroyItem(it.uid);
}

/* ============================================================
   宝箱
   ============================================================ */
/* 品质权重：0 级（坑）与 4 级（通关级）都调低，中段为主 */
function pickWeightedItem(){
  const d = clamp(S.depth + 1, 1, SHADOW_FLOORS);
  const w = [
    Math.max(5, 26 - 2.0*d),     // 0 级
    Math.max(9, 30 - 1.2*d),     // 1 级
    14 + 1.6*d,                  // 2 级
    6 + 2.2*d,                   // 3 级
    Math.max(1.5, 0.6 + 1.2*d),  // 4 级
    0.12,                        // 5 级
  ];
  let total = 0;
  for (let g = 0; g < w.length; g++) if (poolByGrade[g] && poolByGrade[g].length) total += w[g];
  let r = rnd() * total;
  let grade = 0;
  for (let g = 0; g < w.length; g++){
    if (!poolByGrade[g] || !poolByGrade[g].length) continue;
    r -= w[g];
    if (r <= 0){ grade = g; break; }
  }
  const pool = poolByGrade[grade] && poolByGrade[grade].length ? poolByGrade[grade] : null;
  if (!pool) { const ids = drawableIds(); return ids[ri(0, ids.length-1)]; }
  return pool[ri(0, pool.length-1)];
}

/* 生成道具：先检查身上是否有「强制重 Roll」效果（规则：生成时就检测） */
function drawItemId(){
  let id = pickWeightedItem();
  for (let i = 0; i < 8; i++){
    const def = ITEM_BY_ID.get(id);
    if (!def) break;
    // 死亡证明：全角色各通关 5 次后才进入抽取池
    if (def.id === 234 && !deathNoteUnlocked()){ id = pickWeightedItem(); continue; }
    let forced = false;
    for (const it of S.items){
      if (typeof it.def.onDraw === "function" && it.def.onDraw(def)){ forced = true; break; }
    }
    if (!forced) break;
    id = pickWeightedItem();
  }
  return id;
}

function enterChest(){
  const st = stats();
  S.loot = {
    itemId: drawItemId(),
    rollsLeft: st.rolls,
    taken: false,
    openedAt: Date.now(),
  };
  log("📦 你发现了一个宝箱。", "sys");
  showScreen("loot");
  renderLoot();
}

function rerollLoot(){
  if (!S.loot || S.loot.rollsLeft <= 0) return;
  S.loot.rollsLeft--;
  S.loot.itemId = drawItemId();
  renderLoot();
}

function takeLoot(){
  if (!S.loot || S.loot.taken) return;
  S.loot.taken = true;
  const def = ITEM_BY_ID.get(S.loot.itemId);
  const isCain = !!(S.char && S.char.key === "cain");
  // 里该隐：道具会被袋子吃掉，只报数字，不报「获得道具」
  if (def && !isCain) log(`获得道具「${def.name}」`, "item");
  grantItem(S.loot.itemId);
  advanceNode();
  renderAll();
}

/* 跳过宝箱：什么也不拿 */
function skipLoot(){
  if (!S.loot || S.loot.taken) return;
  S.loot.taken = true;
  log("你跳过了这个宝箱。", "sys");
  advanceNode();
  renderAll();
}

/* ============================================================
   商店
   ============================================================ */
function priceOf(def, buying){
  const st = stats();
  if (def && def.price != null) return Math.round(def.price * (S.priceMult || 1));
  if (def && def.grade === 0 && S.items.some(i => i.def.id === 191)) return 0;
  let p = 10 - (st.shopDisc || 0);
  p = Math.round(p * (S.priceMult || 1));
  return Math.max(5, p);
}

/* 本商店里某个商品位当前的标价（优惠的连锁折扣记在商品位上） */
function slotPrice(slot, def){
  const base = priceOf(def, false);
  return Math.max(1, base - (slot && slot.disc ? slot.disc : 0));
}

/* 没有受任何折扣影响时的原价（用于显示划线价） */
function listPriceOf(def){
  if (def && def.price != null) return Math.round(def.price * (S.priceMult || 1));
  if (def && def.grade === 0 && S.items.some(i => i.def.id === 191)) return 0;
  return Math.max(5, Math.round(10 * (S.priceMult || 1)));
}

/* 商店商品：盲盒会把所有商品位换成礼盒 */
function shopStock(n){
  const blind = S.items.some(i => i.def.id === 19);
  return Array.from({length: n}, () => ({ id: blind ? 15 : drawItemId(), sold:false }));
}

function shopSlots(){
  return clamp(stats().shopSlots, 1, 6);
}

function enterShop(){
  if (stats().noShop){
    log("经济危机：这一层没有商店。", "sys");
    if (S.shopFromItem){ S.shopFromItem = false; showScreen("map"); renderMap(); return; }
    advanceNode();
    return;
  }
  const st = stats();
  const slots = shopSlots();
  S.shopState = {
    stock: shopStock(slots),
    refreshes: 0,
  };
  log("🏪 你走进了一间商店。", "sys");
  fireHook("onShopEnter", {});
  showScreen("shop");
  renderShop();
}

function refreshShop(){
  const sh = S.shopState;
  const cost = Math.max(0, stats().refreshPrice);
  if (!sh || sh.refreshes >= 10 || !canPay(cost)) return;
  spendGold(cost);
  sh.refreshes++;
  sh.stock = shopStock(shopSlots());
  if (sh.discAll){ for (const s2 of sh.stock) s2.disc = sh.discAll; }   // 优惠的累计折扣继续生效
  renderShop();
}

function buyShopItem(i){
  const sh = S.shopState;
  const slot = sh.stock[i];
  if (!slot || slot.sold) return;
  const def = ITEM_BY_ID.get(slot.id);
  const price = slotPrice(slot, def);
  if (!canPay(price)) return;
  spendGold(price);
  slot.sold = true;
  grantItem(slot.id);
  log(`购买了「${def.name}」，花费 ${price} 金币`, "gold");
  // 优惠：买走一件后，本商店其余道具的标价 -2
  if (S.items.some(x => x.def.id === 131)){
    sh.discAll = (sh.discAll || 0) + 2;        // 刷新后新上的商品也要降价
    for (const s2 of sh.stock){
      if (s2 === slot || s2.sold) continue;
      s2.disc = (s2.disc || 0) + 2;
    }
    log("优惠：本店其余道具标价 -2", "good");
  }
  // 补货：买走的位置立刻补上一件新商品
  if (S.items.some(i => i.def.id === 13)){
    slot.id = S.items.some(i => i.def.id === 19) ? 15 : drawItemId();
    slot.sold = false;
  }
  // 买二送一
  if (S.items.some(i => i.def.id === 169)){
    S.buyCount = (S.buyCount || 0) + 1;
    if (S.buyCount % 2 === 0){
      const d = randomItemDef(0, 4);
      if (d){ grantItem(d.id); log("买二送一：额外获得一件道具","good"); }
    }
  }
  renderShop();
}

function leaveShop(){
  if (S.shopFromItem){
    S.shopFromItem = false;
    showScreen("map");
    renderMap();
    renderHUD();
    return;
  }
  advanceNode();
  renderAll();
}

/* 点击状态词条：列出这一项是怎么加起来的 */
const STAT_NAMES = {
  addDmg:"加伤", reduceDmg:"减伤", boostDmg:"增伤", luck:"幸运",
  attackCount:"攻击次数", minDmg:"伤害下限", maxDmg:"伤害上限",
  hpMax:"血量上限", heal:"回复量", immunity:"免伤", mult:"伤害倍率",
  goldCap:"金币上限", shopDisc:"商店折扣", enemyDmg:"敌人伤害", enemyMult:"敌人伤害倍率",
};
function openStatDetail(key){
  if (!key) return;
  const st = stats();
  const total = st[key];
  const isMult = (key === "mult" || key === "enemyMult" || key === "healMult" || key === "priceMult");
  const rows = [];
  const add = (name, v, mark) => { if (v) rows.push({ name, v, mark }); };

  if (key in BASE_STATS){
    const b = BASE_STATS[key];
    if (isMult ? b !== 1 : !!b) add("基础值", b, isMult ? "×" : "");
  }
  if (key === "hpMax" && S.char) add(`角色血量（${S.char.name}）`, (S.char.hpRolled ?? S.char.hp), "");
  if (S.perm && S.perm[key] && !(key in BASE_STATS && S.perm[key] === BASE_STATS[key])) add("永久成长", S.perm[key], isMult ? "×" : "");

  for (const it of S.items){
    if (it.spent) continue;
    const m = it.mods || it.def.mods;
    if (!m || m[key] == null) continue;
    if (isMult){ if (m[key] !== 1) add(itName(it), m[key], "×"); }
    else if (m[key]) add(itName(it), m[key], "");
  }

  let sum = isMult ? 1 : 0;
  for (const r of rows) sum = (r.mark === "×") ? sum * r.v : sum + r.v;
  const rest = isMult ? (sum ? Math.round((total / sum) * 100) / 100 : 1) : Math.round(total - sum);
  const restIsNone = isMult ? Math.abs(rest - 1) < 0.001 : rest === 0;

  const fmt = (r) => (r.mark === "×")
    ? `<span style="color:var(--dim)">×${round2(r.v)}</span>`
    : `<span style="color:${r.v > 0 ? "#7fdcaa" : "#e07a7a"}">${sgn(r.v)}</span>`;

  modalShell(`
    <h3>${STAT_NAMES[key] || key} 的构成</h3>
    <div class="msub">当前结算值：<b style="color:var(--gold)">${isMult ? "×" + round2(total) : total}</b></div>
    ${rows.length ? rows.map(r => `
      <div class="modal-row" style="padding:6px 8px">
        <div style="flex:1;font-size:13px">${esc(r.name)}</div>
        <div class="num" style="font-size:13px">${fmt(r)}</div>
      </div>`).join("") : `<div class="empty-note">没有来自道具的加成</div>`}
    ${restIsNone ? "" : `
      <div class="modal-row" style="padding:6px 8px;border-top:1px solid #2c2540">
        <div style="flex:1;font-size:13px;color:var(--dim)">技能 / 规则效果</div>
        <div class="num" style="font-size:13px">${isMult ? `×${round2(rest)}` : sgn(rest)}</div>
      </div>`}
    <div class="modal-close"><button class="btn sm" onclick="closeModal()">关 闭</button></div>`);
}

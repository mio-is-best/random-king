/* ---------------- 伊甸筛种器（测试功能，主界面按 S） ---------------- */
function simulateEden(seed){
  const keepRng = S.rng, keepItems = S.items, keepDepth = S.depth, keepChar = S.char;
  const prevSim = S.simulating;
  S.simulating = true;
  try {
    // 血量：走主随机流的第一步
    S.rng = makeRng(seed + "|eden");
    const hp = ri(30, 50);
    // 两个道具：走独立随机流，和游戏里的发放逻辑一致
    S.rng = makeRng(seed + "|edenitems");
    S.items = []; S.depth = 0; S.char = CHARS.find(c => c.key === "eden");
    const got = [];
    for (let i = 0; i < 2; i++){
      const d = randomItemDef(0, 4);
      if (d){ got.push(d.id); S.items.push({ uid: i + 1, def: d }); }
    }
    return { hp, got };
  } finally {
    S.simulating = prevSim;
    S.rng = keepRng; S.items = keepItems; S.depth = keepDepth; S.char = keepChar;
  }
}

function openSeedSearcher(){
  closeModal();
  const div = document.createElement("div");
  div.id = "modal"; div.className = "modal-bg";
  div.innerHTML = `
    <div class="modal">
      <h3>伊 甸 筛 种 器</h3>
      <div class="msub">测试功能：输入想要的开局，自动搜索一个符合的种子（不限次数，直到找到为止）</div>
      <div class="seed-row" style="margin-bottom:8px">
        <input id="ss-a" class="codex-search" placeholder="道具 A（编号或名字，可空）">
        <input id="ss-b" class="codex-search" placeholder="道具 B（可空）">
      </div>
      <div class="seed-row">
        <input id="ss-hp" class="codex-search" type="number" placeholder="血量（可空）">
        <button class="btn sm" id="ss-go">开始搜索</button>
        <button class="btn ghost sm" id="ss-stop" style="display:none">停止</button>
      </div>
      <div id="ss-out" class="seed-hint" style="min-height:20px"></div>
      <div class="modal-close"><button class="btn sm" onclick="closeModal()">关 闭</button></div>
    </div>`;
  div.onclick = (e) => { if (e.target === div) closeModal(); };
  document.body.appendChild(div);

  const parse = (v) => {
    v = String(v || "").trim();
    if (!v) return null;
    if (/^\d+$/.test(v)) return +v;
    const hit = ITEMS.find(d => d.name === v) || ITEMS.find(d => d.name.includes(v));
    return hit ? hit.id : -1;
  };

  let running = false, stopFlag = false;

  $("#ss-go").onclick = () => {
    const a = parse($("#ss-a").value);
    const b = parse($("#ss-b").value);
    const hpWant = $("#ss-hp").value ? +$("#ss-hp").value : null;
    const out = $("#ss-out");
    if (a === -1 || b === -1){ out.textContent = "道具名字没找到，试试编号。"; return; }
    if (running) return;
    running = true; stopFlag = false;
    $("#ss-go").disabled = true;
    $("#ss-stop").style.display = "";
    const t0 = Date.now();
    let tried = 0;

    const tick = () => {
      if (stopFlag){ finish(null); return; }
      const CHUNK = 6000;
      for (let i = 0; i < CHUNK; i++){
        const seed = genSeed();
        tried++;
        const r = simulateEden(seed);
        const got = r.got.slice();
        let ok = true;
        if (a != null){ const k = got.indexOf(a); if (k < 0) ok = false; else got.splice(k, 1); }
        if (ok && b != null){ const k = got.indexOf(b); if (k < 0) ok = false; else got.splice(k, 1); }
        if (ok && hpWant != null && r.hp !== hpWant) ok = false;
        if (ok){ finish(seed, r); return; }
      }
      const secs = ((Date.now() - t0) / 1000).toFixed(1);
      out.textContent = `已尝试 ${tried.toLocaleString()} 个种子 · ${secs}s · 继续搜索中…`;
      setTimeout(tick, 0);
    };

    const finish = (seed, r) => {
      running = false;
      $("#ss-go").disabled = false;
      $("#ss-stop").style.display = "none";
      if (seed == null){ out.textContent = `已停止（试了 ${tried.toLocaleString()} 个种子）。`; return; }
      const secs = ((Date.now() - t0) / 1000).toFixed(1);
      out.innerHTML = `
        <div style="margin:4px 0 8px">找到种子：<b id="ss-seed" style="color:var(--gold);font-size:18px;letter-spacing:.18em;user-select:text;-webkit-user-select:text">${seed}</b></div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <button class="btn ghost sm" id="ss-copy">复制种子</button>
          <button class="btn sm" id="ss-use">用它开局</button>
        </div>
        <div style="color:var(--dim)">血量 ${r.hp} · 道具 ${r.got.map(id => (ITEM_BY_ID.get(id) || {}).name || id).join("、")} · 试了 ${tried.toLocaleString()} 个（${secs}s）</div>`;
      const seedTxt = seed;
      const copyBtn = $("#ss-copy");
      if (copyBtn) copyBtn.onclick = async () => {
        let okCopy = false;
        try { await navigator.clipboard.writeText(seedTxt); okCopy = true; } catch(e){}
        if (!okCopy){
          try {
            const ta = document.createElement("textarea");
            ta.value = seedTxt; ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.select();
            document.execCommand && document.execCommand("copy");
            document.body.removeChild(ta);
            okCopy = true;
          } catch(e){}
        }
        copyBtn.textContent = okCopy ? "已复制 ✓" : "复制失败";
        setTimeout(() => { copyBtn.textContent = "复制种子"; }, 1600);
      };
      const useBtn = $("#ss-use");
      if (useBtn) useBtn.onclick = () => {
        const inp = $("#seed-input");
        if (inp) inp.value = seedTxt;
        closeModal();
        const hint = $("#seed-hint");
        if (hint) hint.textContent = `已填入种子 ${seedTxt}，选好角色后点「开始冒险」`;
      };
    };

    out.textContent = "搜索中…";
    setTimeout(tick, 20);
  };

  $("#ss-stop").onclick = () => { stopFlag = true; };
}

/* ---------- 地图 ---------- */

/* ============================================================
   地图涂鸦：轨迹存在 S.mapStrokes 里，重绘/滚动都跟着地图走
   ============================================================ */
function mapStrokes(){
  if (!Array.isArray(S.mapStrokes)) S.mapStrokes = [];
  return S.mapStrokes;
}

function setDrawTool(tool){
  S.drawTool = (S.drawTool === tool) ? null : tool;
  renderMap();
}

function clearMapDraw(){
  S.mapStrokes = [];
  S.drawTool = null;
  renderMap();
}

function initMapDraw(){
  const wrap = $("#map-panel .map-wrap");
  const cv = $("#map-draw");
  if (!wrap || !cv) return;

  // 画布铺满整块地图内容（含滚动出去的部分）
  const w = Math.max(wrap.scrollWidth, wrap.clientWidth);
  const h = Math.max(wrap.scrollHeight, wrap.clientHeight);
  cv.width = w;
  cv.height = h;
  cv.style.width = w + "px";
  cv.style.height = h + "px";

  const ctx = cv.getContext("2d");
  const paint = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const st of mapStrokes()){
      if (st.pts.length < 2) continue;
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = st.color || "#e8c46a";
      ctx.lineWidth = st.size || 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(st.pts[0].x, st.pts[0].y);
      for (let i = 1; i < st.pts.length; i++) ctx.lineTo(st.pts[i].x, st.pts[i].y);
      ctx.stroke();
    }
  };
  paint();

  // 按钮
  const pen = $("#btn-pen"), era = $("#btn-eraser"), clr = $("#btn-clear");
  if (pen) pen.onclick = () => setDrawTool("pen");
  if (era) era.onclick = () => setDrawTool("eraser");
  if (clr) clr.onclick = () => clearMapDraw();

  const tool = S.drawTool;
  if (!tool){ cv.style.pointerEvents = "none"; return; }
  cv.style.pointerEvents = "auto";
  cv.style.cursor = tool === "pen" ? "crosshair" : "cell";

  let drawing = false, cur = null;

  const pos = (ev) => {
    const r = cv.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  };

  // 橡皮：删掉附近轨迹点（数据层面，重绘后依然有效）
  const eraseAt = (p) => {
    const R = 14;
    const list = mapStrokes();
    for (let i = list.length - 1; i >= 0; i--){
      const st = list[i];
      st.pts = st.pts.filter(q => Math.hypot(q.x - p.x, q.y - p.y) > R);
      if (st.pts.length < 2) list.splice(i, 1);
    }
    paint();
  };

  cv.onpointerdown = (ev) => {
    ev.preventDefault();
    cv.setPointerCapture && cv.setPointerCapture(ev.pointerId);
    const p = pos(ev);
    if (tool === "eraser"){ drawing = true; eraseAt(p); return; }
    drawing = true;
    cur = { color: "#e8c46a", size: 3, pts: [p] };
    mapStrokes().push(cur);
    paint();
  };
  cv.onpointermove = (ev) => {
    if (!drawing) return;
    ev.preventDefault();
    const p = pos(ev);
    if (tool === "eraser"){ eraseAt(p); return; }
    if (!cur) return;
    cur.pts.push(p);
    paint();
  };
  const end = () => { drawing = false; cur = null; };
  cv.onpointerup = end;
  cv.onpointercancel = end;
  cv.onpointerleave = end;
}

function renderMap(){
  const _scroll = captureScroll();
  const NODE_META = {
    enemy:    { ico:"⚔️", lbl:(n)=> n.boss ? "BOSS" : "第" + n.idx + "层" },
    chest:    { ico:"📦", lbl:()=> "宝箱" },
    shop:     { ico:"🏪", lbl:()=> "商店" },
    campfire: { ico:"🔥", lbl:()=> "火堆" },
    event:    { ico:"❔", lbl:()=> "事件" },
  };
  const doneSet = new Set(S.mapDone || []);
  const reachSet = new Set(S.reach || []);
  // 玩家当前所在行：取可进入节点里最靠下的那一行
  let curRow = -1;
  for (const id of reachSet){ const nd = S.map[id]; if (nd && nd.row > curRow) curRow = nd.row; }
  const rows = (S.mapRows || []).map((row, r) => {
    const cells = row.map(id => {
      const n = S.map[id];
      const meta = NODE_META[n.type] || NODE_META.event;
      const isElite = !!(n.elite && n.type === "enemy");
      const nodeLabel = isElite ? "精英" : meta.lbl(n);
      const base = doneSet.has(id) ? "done" : (reachSet.has(id) ? "now" : "future");
      // 已经走过但没选的分支：在当前行之上，且既不是已通过也不是可进入 → 画红叉
      const state = (base === "future" && curRow >= 0 && n.row < curRow) ? "dead" : base;
      const canClick = reachSet.has(id);
      const mark = (state === "dead" ? `<span class="nx">✕</span>` : "") +
                   (n.elite ? `<span class="fire">🔥</span>` : "");
      return `<div class="node ${state} ${isElite ? "elite" : ""}" data-node="${id}" ${canClick ? `onclick="enterNode(${id})"` : ""} title="${canClick ? "点击进入" : ""}">
        ${meta.ico}<span class="nlabel">${state === "done" ? "·" : (state === "dead" ? "" : nodeLabel)}</span>${mark}
      </div>`;
    }).join(`<div class="branch-gap"></div>`);
    return `<div class="node-row branch-row">${r>0 ? `<div class="connector ${row.some(id=>reachSet.has(id))?'done':''}"></div>` : ""}
      <div class="branch-cells">${cells}</div>
    </div>`;
  }).join("");

  let btn = "";
  const st = stats();
  $("#screen-map").innerHTML = `
    <div class="center-col">
      <div class="sect-title">地 牢 深 处</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px">
        ${btn}
        <button class="btn ghost sm" onclick="openCodex()">道 具 图 鉴</button>
      </div>
      <div class="map-panel" id="map-panel"><div class="map-wrap"><svg class="map-lines" id="map-lines"></svg>${rows}<canvas id="map-draw"></canvas></div></div>
      <div class="draw-tools">
        <button class="draw-btn ${S.drawTool === "pen" ? "on" : ""}" id="btn-pen" title="画笔">✏️</button>
        <button class="draw-btn ${S.drawTool === "eraser" ? "on" : ""}" id="btn-eraser" title="橡皮擦">🧽</button>
        <button class="draw-btn" id="btn-clear" title="清空">🗑️</button>
      </div>
      <div style="margin-top:10px">${logBoxHTML(96)}</div>
      <div class="panel" style="padding:14px;margin-top:12px;text-align:left">
        <div class="inv-head"><span>道 具（${S.items.length} 件）</span><span>金币 ${S.gold}</span></div>
        ${invHTML()}
        <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
          <span class="tag">伤害 ${st.minDmg}–${st.maxDmg}</span>
          <span class="tag">加伤 ${st.addDmg}</span>
          <span class="tag">减伤 ${st.reduceDmg}</span>
          <span class="tag">增伤 ${st.boostDmg}</span>
          <span class="tag">回复 ${st.heal}</span>
          <span class="tag">攻击 ×${st.attackCount}</span>
          <span class="tag">幸运 ${st.luck}</span>
        </div>
      </div>
    </div>
  `;
  bindTips();
  drawMapLines();
  initMapDraw();
  restoreScroll(_scroll);
  const panel = $("#map-panel");
  const cur = $("#map-panel .node.now");
  if (panel && cur) panel.scrollTop = Math.max(0, cur.offsetTop - panel.clientHeight / 2 + 30);
}

/* 点击地图上的节点进入 */
function enterNode(id){
  clearTimeout(S.autoTimer);
  const node = S.map[id];
  if (!node) return;
  if (!(S.reach || []).includes(id)) return;
  if (S.nodeIdx >= 0 && !(S.mapDone || []).includes(S.nodeIdx)) S.mapDone = (S.mapDone || []).concat([S.nodeIdx]);
  S.nodeIdx = id;
  if (node.type === "enemy") startBattle(node.idx, !!node.elite);
  else if (node.type === "chest") enterChest();
  else if (node.type === "shop") enterShop();
  else if (node.type === "campfire") enterCampfire();
  else enterEvent();
}

/* 兼容旧入口：只有一个可选节点时直接进 */
function enterCurrentNode(){
  const list = S.reach || [];
  if (list.length === 1) enterNode(list[0]);
}

/* 火堆：回血 */
function enterCampfire(){
  const heal = Math.max(6, Math.round(maxHp() * 0.35));
  healPlayer(heal);
  log(`🔥 你在火堆旁休息，回复了 ${heal} 点血量。`, "good");
  advanceNode();
  renderAll();
}

/* ---------- 道具栏：主动 / 被动 / 一次性 分三排 ---------- */
function itemIconHTML(it){
  const d = it.def;
  const spent = !!it.spent;
  const usable = !spent && !!(d.use || d.kind === "oneshot");
  const startup = !spent && !!(d.hooks && d.hooks.onBattleStart);
  const badge = d.grade >= 0 ? `<span class="g">${d.grade}</span>` : "";
  const numBadge = (it.num != null && it.num !== d.id) ? `<span class="numtag">#${it.num}</span>` : "";
  return `<div class="itm s${d.grade} ${usable?'usable':''} ${spent?'spent':''} ${it.isNew?'new':''}"
      data-tip="${it.uid}" data-use="${usable?it.uid:''}">${d.icon}${badge}${numBadge}${usable?'<b class="use">⚡</b>':''}${startup?'<b class="startup">⏳</b>':''}</div>`;
}


/* 身上这件道具在「图鉴上」的编号（打乱/合同后仍以玩家看到的编号为准） */
function itemNo(it){ return (it && it.num != null) ? it.num : (it && it.def ? it.def.id : 0); }

function invHTML(){
  if (!S.items.length) return `<div class="empty-note">还没有任何道具</div>`;
  const rows = [
    ["主动",   S.items.filter(it => it.def.use && it.def.kind !== "oneshot")],
    ["被动",   S.items.filter(it => !it.def.use)],
    ["一次性", S.items.filter(it => it.def.kind === "oneshot")],
  ].filter(r => r[1].length);       // 空的那一排直接缩起来
  return rows.map(([name, list]) => `
    <div class="inv-row">
      <div class="inv-row-name">${name}</div>
      <div class="inv">${list.map(itemIconHTML).join("")}</div>
    </div>`).join("");
}

/* 使用道具：主动道具单击图标，一次性道具双击图标 */
function useItem(uid){
  const it = S.items.find(x => x.uid == uid);
  if (!it || !it.def.use) return;
  if (S.busy) return;
  // 防手滑：同一个道具 220ms 内只认一次
  const now = Date.now();
  if (S._lastUse && S._lastUse.uid == it.uid && now - S._lastUse.t < 220) return;
  S._lastUse = { uid: it.uid, t: now };
  // 「花费 1 金币的主动」可以设置成弹窗问用几次
  if (S.repeatPrompt && it.def.costGold === 1 && !S._repeatRunning){
    const max = Math.max(1, Math.min(10, Math.floor((S.gold - goldFloor()) / 1)));
    if (max > 1){
      promptNumber("使用几次", `这个道具每次花 ${it.def.costGold} 金币，最多 ${max} 次`, 1, max, (n) => {
        S._repeatRunning = true;
        try {
          for (let i = 0; i < n; i++){
            const cur = S.items.find(x => x.uid == uid);
            if (!cur) break;
            S._lastUse = null;
            useItem(uid);
          }
        } finally { S._repeatRunning = false; }
      });
      return;
    }
  }

  S.cActive = (S.cActive || 0) + 1;
  if (it.def.kind === "oneshot") S.cOneshot = (S.cOneshot || 0) + 1;
  const a = api(it, stats());
  let ok = true;
  try { ok = it.def.use(a, it); } catch(e){ console.error(e); ok = false; }
  hideTip();                 // 触屏没有 mouseleave，用完主动把提示收起来
  if (ok === false) return;
  if (it.def.kind === "oneshot") destroyItem(it.uid);
  afterStateChange();
  resolveDeath();      // 自杀式道具（反骨刀等）也要走死亡结算
}

/* 一条很短的手工地图：战斗 → 宝箱 → BOSS */
function tutorialMap(){
  const mk = (id, row, type) => ({ id, row, type, next: [], idx: 0 });
  const a = mk(0, 0, "enemy"); a.idx = 1;
  const b = mk(1, 1, "chest");

function cloudReady(){ return !!(CLOUD.url && CLOUD.key); }

/* ---------------- 会话 ---------------- */
function sessGet(){
  try { return JSON.parse(localStorage.getItem("rk4_session") || "null"); } catch(e){ return null; }
}
function sessSet(v){
  try { v ? localStorage.setItem("rk4_session", JSON.stringify(v)) : localStorage.removeItem("rk4_session"); } catch(e){}
}
function account(){
  const s = sessGet();
  return (s && s.user) ? s.user : null;
}
function accessToken(){
  const s = sessGet();
  return s ? s.access_token : null;
}

function authHeaders(){
  return {
    "apikey": CLOUD.key,
    "Authorization": "Bearer " + (accessToken() || CLOUD.key),
    "Content-Type": "application/json",
  };
}

async function authRequest(path, body){
  const r = await fetch(CLOUD.url + "/auth/v1" + path, {
    method: "POST",
    headers: { "apikey": CLOUD.key, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.error || ("HTTP " + r.status));
  return j;
}

async function doSignUp(email, password){
  const j = await authRequest("/signup", { email, password });
  if (j.access_token){
    sessSet({ access_token: j.access_token, refresh_token: j.refresh_token, user: j.user,
              expires_at: Date.now() + (j.expires_in || 3600) * 1000 });
    return { ok: true, verified: true };
  }
  // 没直接给会话：可能只是没返回 token，先尝试立刻登录一次
  try {
    await doSignIn(email, password);
    return { ok: true, verified: true, autoLogin: true };
  } catch(e){}
  return { ok: true, verified: false };
}

async function doSignIn(email, password){
  const j = await authRequest("/token?grant_type=password", { email, password });
  sessSet({ access_token: j.access_token, refresh_token: j.refresh_token, user: j.user,
            expires_at: Date.now() + (j.expires_in || 3600) * 1000 });
  return j.user;
}

function doSignOut(){
  sessSet(null);
  closeModal();
  renderTitle && renderTitle();
  afterStateChange();
  openAccount();
}

/* ---------------- 云存档 ---------------- */
function saveBlob(){
  const out = {};
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.indexOf("rk4_") === 0 && k !== "rk4_session") out[k] = localStorage.getItem(k);
    }
  } catch(e){}
  return out;
}

function applyBlob(data){
  if (!data) return false;
  try {
    for (const k in data){ if (k.indexOf("rk4_") === 0) localStorage.setItem(k, data[k]); }
    return true;
  } catch(e){ return false; }
}


/* 会话过期自动续期（Supabase access_token 默认 1 小时） */
async function ensureSession(){
  const ss = sessGet();
  if (!ss || !ss.access_token) return false;
  const exp = ss.expires_at || 0;
  if (exp && Date.now() < exp - 60000) return true;
  if (!ss.refresh_token){ sessSet(null); return false; }
  try {
    const r = await fetch(CLOUD.url + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { "apikey": CLOUD.key, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: ss.refresh_token }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    sessSet({ access_token: j.access_token, refresh_token: j.refresh_token, user: j.user,
              expires_at: Date.now() + (j.expires_in || 3600) * 1000 });
    return true;
  } catch(e){
    sessSet(null);
    return false;
  }
}

async function cloudUpload(silent){
  if (!cloudReady() || !account()){ if(!silent) log("云存档：还没登录。","sys"); return false; }
  if (!(await ensureSession())){ if(!silent) log("云存档：登录已过期，请重新登录。","hurt"); return false; }
  const u = account();
  const body = JSON.stringify([{ user_id: u.id, data: saveBlob(), updated_at: new Date().toISOString() }]);
  try {
    const r = await fetch(`${CLOUD.url}/rest/v1/${CLOUD.table}?on_conflict=user_id`, {
      method: "POST",
      headers: Object.assign(authHeaders(), { "Prefer": "resolution=merge-duplicates,return=minimal" }),
      body,
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    try { localStorage.setItem("rk4_cloud_last", String(Date.now())); } catch(e){}
    if (!silent) log("云存档：已上传。","good");
    return true;
  } catch(e){
    if (!silent) log("云存档：上传失败（"+e.message+"）","hurt");
    return false;
  }
}

async function cloudFetchMine(){
  if (!cloudReady() || !account()) return null;
  if (!(await ensureSession())) return null;
  const u = account();
  try {
    const r = await fetch(`${CLOUD.url}/rest/v1/${CLOUD.table}?user_id=eq.${encodeURIComponent(u.id)}&select=*`, {
      headers: authHeaders(),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const arr = await r.json();
    return arr && arr[0] ? arr[0] : null;
  } catch(e){
    log("云存档：读取失败（"+e.message+"）","hurt");
    return null;
  }
}

async function cloudDownload(silent){
  if (!cloudReady()) return false;
  if (!account()){ if (!silent) log("云存档：先登录。","sys"); return false; }
  const row = await cloudFetchMine();
  if (!row){ if (!silent) log("云存档：云端还没有存档（先上传一次）。","sys"); return false; }
  if (applyBlob(row.data)){
    if (!silent) log("云存档：已下载，正在刷新…","good");
    setTimeout(() => location.reload(), 500);
    return true;
  }
  return false;
}

/* 登录后：云端有就下载，没有就把本地推上去 */
async function cloudSyncAfterLogin(){
  if (!cloudReady()) return;
  const row = await cloudFetchMine();
  if (row && row.data && Object.keys(row.data).length){
    const remote = Date.parse(row.updated_at || 0) || 0;
    const local = parseInt(localStorage.getItem("rk4_cloud_last") || "0", 10) || 0;
    if (remote > local){
      if (applyBlob(row.data)){
        log("云存档：已同步账号进度。","good");
        setTimeout(() => location.reload(), 400);
        return;
      }
    }
  }
  await cloudUpload(true);
}

let cloudTimer = null;
function cloudTouch(){
  if (!cloudReady() || !account()) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => cloudUpload(true), 8000);
}

function formulaText(B){
  const f = B && B.lastFormula;
  if (!f) return "原伤害 —";
  if (!f.steps.length) return `${f.roll} = ${f.final}`;
  return `${f.roll} ${f.steps.join(" ")} = ${f.final}`;
}

/* 战斗内的常驻修正，显示在计算器上（钢得的 ×2 等） */
function buffText(st){
  const parts = [];
  if (st.mult !== 1) parts.push(`伤害 ×${round2(st.mult)}`);
  if (st.attackCount > 1) parts.push(`攻击 ×${st.attackCount}`);
  if (st.enemyMult !== 1) parts.push(`敌伤 ×${round2(st.enemyMult)}`);
  if (st.boostDmg) parts.push(`增伤 ${sgn(st.boostDmg)}`);
  return parts.join(" · ");
}

/* 在地图上画出树状的连线 */
function drawMapLines(){
  const wrap = $("#map-panel .map-wrap");
  const svg = $("#map-lines");
  if (!wrap || !svg) return;
  const wr = wrap.getBoundingClientRect();
  const curSet = new Set(S.reach || []);
  const doneSet = new Set(S.mapDone || []);
  const parts = [];
  for (const n of S.map){
    for (const c of (n.next || [])){
      const a = wrap.querySelector(`[data-node="${n.id}"]`);
      const b = wrap.querySelector(`[data-node="${c}"]`);
      if (!a || !b) continue;
      const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
      const x1 = ar.left - wr.left + ar.width / 2;
      const y1 = ar.top - wr.top + ar.height;
      const x2 = br.left - wr.left + br.width / 2;
      const y2 = br.top - wr.top;
      const live = (curSet.has(n.id) || doneSet.has(n.id)) && curSet.has(c);
      const cls = live ? "live" : (doneSet.has(n.id) ? "done" : "");
      parts.push(`<path class="${cls}" d="M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}"/>`);
    }
  }
  svg.setAttribute("viewBox", `0 0 ${wr.width} ${wrap.scrollHeight}`);
  svg.setAttribute("width", wr.width);
  svg.setAttribute("height", wrap.scrollHeight);
  svg.innerHTML = parts.join("");
}

/* 描述里的概率按「幸运 / 大大大顺」实时换算，被改动的用绿色显示 */
function colorizeChances(text, def){
  const st = stats();
  const dbl = S.items.some(i => i.def.id === 392 && !i.spent);
  // 不受幸运影响的道具（达摩剑的致死率、按敌人血量算的百分比等）
  // 另外：大大大顺自己的描述、以及「按敌人血量算百分比」的描述也不该被改写
  const locked = !!(def && (def.pctLocked || def.id === 392 ||
    /敌人(的)?(当前)?血/.test(String(text || ""))));
  return esc(text).replace(/(\d+(?:\.\d+)?)%/g, (m, n) => {
    const base = parseFloat(n);
    if (locked) return `<span style="color:#b9b0c8">${base}%</span>`;
    let p = base / 100;
    if (dbl && p <= 0.5) p *= 2;
    p = Math.min(0.95, clamp(p + st.luck * 0.05, 0, 1));
    const v = Math.round(p * 100);
    if (v === base) return `<span style="color:#b9b0c8">${v}%</span>`;
    return `<span style="color:#57c99b;font-weight:700">${v}%</span>`;
  });
}

  return {
    winY: (typeof window !== "undefined" && window.scrollY) || 0,
    map: (() => { const el = $(".map-panel"); return el ? el.scrollTop : 0; })(),
    log: (() => { const el = $("#logbox"); return el ? el.scrollTop : 0; })(),
    logStick: (() => { const el = $("#logbox"); return el ? logAtBottom(el) : true; })(),
    scr: (() => { const el = $(".screen"); return el ? el.scrollTop : 0; })(),
  };
}
function restoreScroll(k){
  if (!k) return;
  const doIt = () => {
    const mp = $(".map-panel"); if (mp && k.map) mp.scrollTop = k.map;
    const lb = $("#logbox");
    if (lb){
      attachLogScroll(lb);
      if (logStick) pinLog(lb);
      else if (k.log) setLogScroll(lb, k.log);
    }
    const sc = $(".screen"); if (sc && k.scr) sc.scrollTop = k.scr;
    if (typeof window !== "undefined" && k.winY) window.scrollTo(0, k.winY);
  };
  doIt();
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(doIt);
  else setTimeout(doIt, 16);
}

}
function hasAch(id){ return !!achStore()[id]; }

function unlockAch(id){
  const o = achStore();
  if (o[id]) return;
  o[id] = Date.now();

  const a = ACHIEVEMENTS.find(x => x.id === id);

function checkAchievements(){
  try {
    const st = stats();
    if ((getRecord().wins || 0) > 0) unlockAch("first_win");

    if (S.items.length >= 15) unlockAch("collector");
    if ((S.totalKills || 0) >= 30) unlockAch("butcher");   // 屠戮：累计 30 杀
    if ((S.depth || 0) >= 12) unlockAch("deepest");

function saveRecord(win){
  try {
    const key = "rk4_best";
    const prev = JSON.parse(localStorage.getItem(key) || "{}");
    const depth = Math.max(prev.depth || 0, S.depth);
    const wins = (prev.wins || 0) + (win ? 1 : 0);
    localStorage.setItem(key, JSON.stringify({ depth, wins }));
  } catch(e){}
}
function getRecord(){
  try { return JSON.parse(localStorage.getItem("rk4_best") || "{}"); } catch(e){ return {}; }
}

/* 角色通关星数 */
function bumpCharStar(key, opts){
  opts = opts || {};
  const n = opts.count || 1;
  try {
    const o = JSON.parse(localStorage.getItem("rk4_stars") || "{}");
    o[key] = (o[key] || 0) + n;
    localStorage.setItem("rk4_stars", JSON.stringify(o));
    if (opts.shiny){
      const sh = JSON.parse(localStorage.getItem("rk4_shiny") || "{}");
      sh[key] = (sh[key] || 0) + n;
      localStorage.setItem("rk4_shiny", JSON.stringify(sh));
    }
  } catch(e){}
}
function charShinyStars(key){
  try {
    const o = JSON.parse(localStorage.getItem("rk4_shiny") || "{}");
    return o[key] || 0;
  } catch(e){ return 0; }
}
function charStars(key){
  try {
    const o = JSON.parse(localStorage.getItem("rk4_stars") || "{}");
    return o[key] || 0;
  } catch(e){ return 0; }
}

function maxCharStars(){
  let m = 0;
  for (const c of CHARS) m = Math.max(m, charStars(c.key));
  return m;
}

function promptNumber(title, sub, min, max, cb, def){
  if (S.simulating) return;

  const start = def != null ? def : Math.round((min + max) / 2);
  const div = modalShell(`
    <h3>${esc(title)}</h3>
    <div class="msub">${esc(sub || "")}</div>
    <input id="pn-input" class="num-input num" type="number" min="${min}" max="${max}" value="${start}">
    <div class="modal-close"><button class="btn sm" id="pn-ok">确 定</button></div>`);
  const input = $("#pn-input", div);
  $("#pn-ok", div).onclick = () => {
    let v = parseInt(input.value, 10);
    if (isNaN(v)) v = min;
    v = Math.max(min, Math.min(max, v));
    closeModal();
    try { cb(v); } finally { afterStateChange(); resolveDeath(); }   // 弹窗里改的状态立刻反映到界面
  };
  input.focus();
  input.select();
}

    name: `${itName(it)}（${it.def.grade}级）`,
    desc: itDesc(it),

    color: gradeColor(it.def.grade),
    uid: it.uid,
  }));
  if (!opts.length){ log("你身上没有可以移除的道具。", "sys"); return false; }
  chooseOne(title, "选择一个你拥有的道具", opts, (o) => cb(o.uid));
  return true;
}

/* 挑选道具面板：支持搜索与「按等级/按编号」排序 */
function pickItem(gradeMin, gradeMax, cb, title, opts){
  if (S.simulating) return;
  opts = opts || {};

  // 编号 → 实际道具：合同 / 合成宝袋改写后，挑选界面也要显示、也要能搜到
  // 先按「格子原本的等级」筛，再套上显示层的改写
  // （合同会把 1~28 号显示成 -1 级的角色能力，不能因此被等级筛选踢掉）
  const all = (opts.all
      ? ITEMS.filter(d => d.id !== 0 && d.id !== 299)          // 控制台自己不给
      : opts.negative
        ? ITEMS.filter(d => d.id <= -30)
        : ITEMS.filter(d => d.id > 0 && d.draw !== false &&
            (d.grade || 0) >= gradeMin && (d.grade || 0) <= gradeMax))
    .map(d0 => Object.assign({}, shownDef(d0.id) || d0, { slot: d0.id }));
  const ui = { q: "", sort: "grade" };

  closeModal();
  const div = document.createElement("div");
  div.id = "modal"; div.className = "modal-bg";
  div.innerHTML = `
    <div class="modal codex-modal">
      <h3>${esc(title || "挑选道具")}</h3>
      <div class="msub">${opts.all ? `全部道具（含角色能力）· ${all.length} 件` : opts.negative ? "负编号道具" : `可选等级：${gradeMin} ~ ${gradeMax} 级`}</div>
      <div class="codex-bar">
        <input id="pick-q" class="codex-search" type="search" placeholder="搜索编号 / 名字 / 效果…">
        <button class="btn ghost sm" id="pick-sort">按编号排</button>
      </div>
      <div id="pick-count" class="codex-count"></div>
      <div id="pick-rows"></div>
      <div class="modal-close"><button class="btn ghost sm" onclick="closeModal()">取 消</button></div>
    </div>`;
  div.onclick = (e) => { if (e.target === div) closeModal(); };
  document.body.appendChild(div);

  const render = () => {
    const toks = ui.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let list = all.filter(d => {
      if (!toks.length) return true;
      const hay = (`#${d.slot} ${d.slot} #${d.id} ${d.id} ${d.name} ${d.desc} ${d.type}`).toLowerCase();
      return toks.every(t => hay.includes(t));
    });
    list = list.slice().sort(ui.sort === "id"
      ? (a, b) => a.slot - b.slot
      : (a, b) => a.grade - b.grade || a.slot - b.slot);

    const cnt = $("#pick-count");
    if (cnt) cnt.textContent = `可选 ${list.length} / ${all.length} 件`;
    const rows = $("#pick-rows");
    if (!rows) return;
    if (!list.length){
      rows.innerHTML = `<div class="empty-note" style="text-align:center;padding:20px 0">没有匹配的道具</div>`;
      return;
    }
    rows.innerHTML = list.map(d => `
      <div class="modal-row pick" data-id="${d.slot}">
        <div class="mi">${d.icon}</div>
        <div style="flex:1">
          <div class="mn" style="color:${gradeColor(d.grade)}">${esc(d.name)}
            <span style="color:#6f6786;font-weight:400;font-size:11.5px">#${d.slot}</span>
            <span style="color:#6f6786;font-weight:400;font-size:11px">·${d.grade < 0 ? '角色能力' : d.grade + '级'} · ${d.type}${d.kind==='oneshot'?' · 一次性':''}${(d.use && d.kind!=='oneshot')?' · 主动':''}</span>
          </div>
          <div class="md">${colorizeChances(d.desc, d)}</div>
        </div>
      </div>`).join("");
    rows.querySelectorAll(".pick").forEach(row => {
      row.onclick = () => {
        const id = +row.dataset.id;
        closeModal();
        try { cb(id); } finally { afterStateChange(); resolveDeath(); }
      };
    });
  };

  const qi = $("#pick-q");
  qi.addEventListener("input", () => { ui.q = qi.value; render(); });
  $("#pick-sort").addEventListener("click", () => {
    ui.sort = (ui.sort === "id") ? "grade" : "id";
    $("#pick-sort").textContent = (ui.sort === "id") ? "按等级排" : "按编号排";
    render();
  });

  render();
  qi.focus();
}

function renderCodexList(){
  const box = $("#codex-list");
  if (!box) return;
  const raw = (S.codex.q || "").trim();
  const tokens = raw.toLowerCase().split(/\s+/).filter(Boolean);

  // 每一格依旧按原编号排列，但显示的是重排/合同之后的道具
  let list = ITEMS.map(d0 => Object.assign({}, shownDef(d0.id) || d0, { slot: d0.id }));
  if (tokens.length){
    list = list.filter(d => {
      const hay = (`#${d.slot} ${d.slot} #${d.id} ${d.id} ${d.name} ${d.desc} ${d.type}` +
        `${d.kind === "oneshot" ? " 一次性" : ""}${d.use ? " 主动" : ""}`).toLowerCase();
      return tokens.every(t => hay.includes(t));
    });
  }

  if (cnt){
    cnt.textContent = raw
      ? `匹配 ${list.length} / ${ITEMS.length} 件`
      : `共 ${ITEMS.length} 件`;
  }

  if (!list.length){
    box.innerHTML = `<div class="empty-note" style="text-align:center;padding:24px 0">没有匹配的道具</div>`;
    return;
  }

  const rowHTML = (d, showGrade) => `
    <div class="modal-row">
      <div class="mi">${d.icon}</div>
      <div style="flex:1">
        <div class="mn" style="color:${gradeColor(d.grade)}">${esc(d.name)}
          <span style="color:#6f6786;font-weight:400;font-size:11.5px">#${d.slot != null ? d.slot : d.id}</span>
          <span style="color:#6f6786;font-weight:400;font-size:11px">·${showGrade ? (d.grade < 0 ? "角色能力 · " : d.grade + "级 · ") : ""}${d.type}${d.kind==='oneshot'?' · 一次性':''}${d.kind==='instant'?' · 立即生效':''}${(d.use && d.kind!=='oneshot')?' · 主动':''}</span>
        </div>
        <div class="md">${colorizeChances(d.desc, d)}</div>
      </div>
    </div>`;

  if (S.codex.sort === "id"){
    list.sort((a, b) => a.slot - b.slot);
    box.innerHTML = list.map(d => rowHTML(d, true)).join("");
    return;
  }

  const byGrade = {};
  for (const d of list){ (byGrade[d.grade] = byGrade[d.grade] || []).push(d); }
  box.innerHTML = Object.keys(byGrade).map(Number).sort((a, b) => a - b).map(g => `
    <div style="margin:14px 0 6px;font-size:12px;letter-spacing:.2em;color:${gradeColor(g)}">
      ${g < 0 ? "角色能力" : g + " 级"} · ${byGrade[g].length} 件
    </div>
    ${byGrade[g].sort((a, b) => a.slot - b.slot).map(d => rowHTML(d, false)).join("")}
  `).join("");
}

/* ---------------- 长按连发 ---------------- */
let holdStartTimer = null, holdRepeatTimer = null, holdUid = null;
function stopHold(){
  clearTimeout(holdStartTimer);
  clearInterval(holdRepeatTimer);
  holdStartTimer = holdRepeatTimer = null;
  holdUid = null;
  $$(".itm.holding").forEach(el => el.classList.remove("holding"));
}
function startHold(uid, el){
  stopHold();
  holdUid = uid;
  holdStartTimer = setTimeout(() => {
    holdStartTimer = null;
    if (holdUid !== uid) return;
    const el2 = $(`[data-use="${uid}"]`) || el;
    if (el2) el2.classList.add("holding");
    holdRepeatTimer = setInterval(() => {
      if (holdUid !== uid){ stopHold(); return; }
      const it = S.items.find(x => x.uid == uid);
      if (!it || it.spent || S.busy){ stopHold(); return; }
      S._lastUse = null;             // 连发不受防连点限制
      useItem(uid);
    }, 260);
  }, 650);
}
/* 手指/鼠标一松开就停：绑在 document 上，界面重绘也不会丢 */
document.addEventListener("pointerup", stopHold, true);
document.addEventListener("pointercancel", stopHold, true);
document.addEventListener("mouseup", stopHold, true);
document.addEventListener("touchend", stopHold, true);
if (typeof window !== "undefined") window.addEventListener("blur", stopHold);

function bindTips(){
  const tip = $("#tip");
  $$("[data-tip]").forEach(el => {
    const it = S.items.find(x => x.uid == el.dataset.tip);
    const isOneShot = !!(it && it.def.kind === "oneshot");
    el.onmouseenter = (ev) => {
      if (!it) return;
      const d = it.def;
      const kindTxt = d.kind === "oneshot" ? " · 一次性" : (d.kind === "instant" ? " · 立即生效" : (d.use ? " · 主动" : ""));
      const hint = isOneShot ? (S.oneshotClick === "single" ? "单击图标使用" : "双击图标使用") : (d.use ? "单击图标使用" : "");
      tip.innerHTML = `
        <div class="tn" style="color:${gradeColor(d.grade)}">${esc(itName(it))}</div>
        <div class="tm">#${itemNo(it)}${d.grade >= 0 ? ` · ${d.grade} 级` : " · 角色能力"} · ${d.type}${kindTxt}</div>
        <div class="td">${colorizeChances(itDesc(it), it.def)}</div>
        ${hint ? `<div class="tm" style="margin-top:6px;color:#e8c46a">${hint}</div>` : ""}`;
      tip.classList.add("on");
      moveTip(ev);
    };
    el.onmousemove = moveTip;
    el.onmouseleave = () => tip.classList.remove("on");
    if (el.dataset.use){
      if (isOneShot){
        if (S.oneshotClick === "single"){
          el.onclick = (ev) => { ev.stopPropagation(); useItem(el.dataset.use); };
        } else {
          el.ondblclick = () => useItem(el.dataset.use);
        }
      } else {
        el.onclick = (ev) => { ev.stopPropagation(); useItem(el.dataset.use); };
      }
      // 长按 1 秒：连续使用（计时器与手指状态放在全局，界面重绘也不会失控）
      el.addEventListener("pointerdown", (ev) => {
        if (!el.dataset.use) return;
        if (ev.button != null && ev.button !== 0) return;
        startHold(el.dataset.use, el);
      });
    }
  });
}

/* 道具实例的名称/描述（部分道具获得时会确定数值） */
function itName(it){
  return it.name || it.def.name;
}
function itDesc(it){
  // 有「实时数值」描述的道具（如炮塔的 α/β）每次读取都按当前数值生成
  let base = (typeof it.def.dynDesc === "function") ? it.def.dynDesc(it) : (it.desc || it.def.desc);
  // 永久成长的道具：把已经长出来的数值补在描述后面
  const g = it.grown;
  if (g){
    const names = { addDmg:"伤害", reduceDmg:"减伤", boostDmg:"增伤", hpMax:"血量上限",
                    luck:"幸运", minDmg:"伤害下限", maxDmg:"伤害上限", heal:"回复", attackCount:"攻击次数" };
    const parts = Object.keys(g).filter(k => g[k]).map(k => `${names[k] || k} +${g[k]}`);
    if (parts.length) base += `（已成长：${parts.join("、")}）`;
  }
  return base;
}
function moveTip(ev){
  const tip = $("#tip");
  const pad = 8;
  let x = ev.clientX + 16, y = ev.clientY + 16;
  const r = tip.getBoundingClientRect();
  const w = r.width || 220, h = r.height || 80;
  // 手机上向左偏会被屏幕挡住：先按常规放，再夹进视口
  if (x + w > innerWidth - pad) x = ev.clientX - w - 14;
  if (y + h > innerHeight - pad) y = ev.clientY - h - 14;
  if (x < pad) x = pad;
  if (x + w > innerWidth - pad) x = Math.max(pad, innerWidth - w - pad);
  if (y < pad) y = pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}

function summonConsole(){
  if (S.items.some(i => i.def.id === 299)){
    log("控制台已经在身上了。", "sys");
    return;
  }
  grantItem(299);
  log("……咔哒。控制台被唤醒了。", "item");
  afterStateChange();
}
